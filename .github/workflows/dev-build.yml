name: Launcher Dev Build

# Manual only (Actions budget): builds an installable dev launcher for people who do not build Rust.
# The bundle carries its own identifier and game directory, so it installs next to the player one.
# Dev behaviour itself is off until BLOCKFIELD_DEV_BUILD=1, which only this workflow sets.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        default: windows-x86_64
        options: [windows-x86_64, linux-x86_64, macos-aarch64, macos-x86_64]
      ref:
        description: Branch or tag to build
        type: string
        default: main

concurrency:
  group: launcher-dev-build-${{ inputs.platform }}-${{ inputs.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Dev launcher (${{ inputs.platform }})
    timeout-minutes: 60
    runs-on: >-
      ${{ inputs.platform == 'windows-x86_64' && 'windows-2025'
      || inputs.platform == 'macos-aarch64' && 'macos-15'
      || inputs.platform == 'macos-x86_64' && 'macos-15-intel'
      || 'ubuntu-22.04' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        if: runner.os == 'macOS'
        with:
          version: 11
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: runner.os != 'macOS'
        with:
          python-version: '3.12.10'
      - name: Cache pinned project tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: runner.os != 'macOS'
        with:
          path: |
            .cache/quality
            .dev/jdk
          key: quality-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('scripts/toolchain.py', 'scripts/quality.py', 'dev/quality.py') }}
      - run: python -I -X utf8 scripts/toolchain.py --ci
        if: runner.os != 'macOS'
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ inputs.platform == 'macos-aarch64' && 'aarch64-apple-darwin' || inputs.platform == 'macos-x86_64' && 'x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: github-dev-${{ inputs.platform }}
          workspaces: |
            . -> target
            src-tauri -> src-tauri/target
      - name: Linux build deps
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: scripts/install-tauri-deps.sh libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Locate pnpm store
        id: pnpm-store-1
        if: runner.os != 'macOS'
        shell: bash
        run: echo "path=$(python -I -X utf8 scripts/quality.py run pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: runner.os != 'macOS'
        with:
          path: ${{ steps.pnpm-store-1.outputs.path }}
          key: pnpm-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: just setup
        if: runner.os != 'macOS'
      - name: Locate pnpm store
        id: pnpm-store-2
        if: runner.os == 'macOS'
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: runner.os == 'macOS'
        with:
          path: ${{ steps.pnpm-store-2.outputs.path }}
          key: pnpm-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
        if: runner.os == 'macOS'
      - uses: tauri-apps/tauri-action@v0
        env:
          BLOCKFIELD_DEV_BUILD: '1'
          VITE_BLOCKFIELD_PACK_URL: ${{ vars.VITE_BLOCKFIELD_PACK_URL }}
        with:
          tauriScript: ${{ runner.os == 'macOS' && 'pnpm tauri' || 'just tauri' }}
          args: >-
            --config src-tauri/tauri.dev.conf.json
            ${{ inputs.platform == 'macos-aarch64' && '--target aarch64-apple-darwin' || inputs.platform == 'macos-x86_64' && '--target x86_64-apple-darwin' || '' }}
      # A rolling prerelease, not an artifact: Actions artifact storage is shared with every other
      # repository and runs out; release assets do not compete for it and are a plain download link.
      - name: Publish to the rolling dev prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Only the installers themselves: an AppImage build leaves a whole AppDir under bundle/.
          files=$(find target -path '*/release/bundle/*' -type f \( -name '*.deb' -o -name '*.rpm' \
            -o -name '*.AppImage' -o -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \) | sort)
          [ -n "$files" ] || { echo "no bundles built"; exit 1; }
          echo "$files"
          gh release view launcher-dev >/dev/null 2>&1 || gh release create launcher-dev \
            --prerelease --title "Dev builds" \
            --notes "Rolling developer builds (BLOCKFIELD_DEV_BUILD=1). Not for players; the updater ignores this repository."
          # shellcheck disable=SC2086
          gh release upload launcher-dev $files --clobber
