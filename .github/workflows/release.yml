name: Launcher Release

# Signed assets stay in a draft until every platform and quality check succeeds.
on:
  push:
    tags: ['launcher-v*']
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

concurrency:
  group: launcher-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    timeout-minutes: 20
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tag must match package.json version
        if: github.ref_type == 'tag'
        run: |
          v=$(node -p "require('./package.json').version")
          [ "launcher-v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package.json version $v"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: pnpm/action-setup@v4
        if: runner.os == 'macOS'
        with:
          version: 11
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: runner.os != 'macOS'
        with:
          python-version: '3.12.10'
      - run: python -I -X utf8 scripts/toolchain.py --ci
        if: runner.os != 'macOS'
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          # A cache built on Tenki (Ubuntu 24.04) restored here as a full match and broke clippy with
          # "can't find crate": the key names the runner image so the two never mix.
          key: gh2204
          workspaces: . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2.83.2
        with:
          tool: cargo-audit
          fallback: none
      - name: Install Tauri system dependencies
        timeout-minutes: 8
        run: scripts/install-tauri-deps.sh libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: just setup
        if: runner.os != 'macOS'
      - run: pnpm install --frozen-lockfile
        if: runner.os == 'macOS'
      - run: just check
      - run: just version-check
      - run: just config-test
      - run: just build
      - run: just audit
      - run: just cargo-audit

  secret-scan:
    name: Secret scan
    timeout-minutes: 10
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history
        run: >-
          docker run --rm
          --volume "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          detect --source=/repo --config=/repo/.gitleaks.toml --verbose --redact

  tauri-release:
    needs: [quality, secret-scan]
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    name: Build launcher (${{ matrix.name }})
    timeout-minutes: 60
    environment: dev
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep Ubuntu 22.04 as the Linux glibc baseline.
          - name: linux-x86_64
            os: ubuntu-22.04
            args: ''
          - name: windows-x86_64
            os: windows-2025
            args: ''
          - name: macos-aarch64
            os: macos-15
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-15-intel
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        if: runner.os == 'macOS'
        with:
          version: 11
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: runner.os != 'macOS'
        with:
          python-version: '3.12.10'
      - run: python -I -X utf8 scripts/toolchain.py --ci
        if: runner.os != 'macOS'
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.target || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: github-${{ matrix.os }}-${{ matrix.name }}
          workspaces: |
            . -> target
            src-tauri -> src-tauri/target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux build deps
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: scripts/install-tauri-deps.sh libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: just setup
        if: runner.os != 'macOS'
      - run: pnpm install --frozen-lockfile
        if: runner.os == 'macOS'
      - run: just config-check
        if: runner.os != 'macOS'
        env:
          VITE_BLOCKFIELD_PACK_URL: ${{ vars.VITE_BLOCKFIELD_PACK_URL }}
      - run: pnpm config:check
        if: runner.os == 'macOS'
        env:
          VITE_BLOCKFIELD_PACK_URL: ${{ vars.VITE_BLOCKFIELD_PACK_URL }}
      - name: Patch linuxdeploy GTK plugin for Wayland compatibility and metadata
        if: runner.os == 'Linux'
        run: |
          mkdir -p ~/.cache/tauri
          curl -sSL -o ~/.cache/tauri/linuxdeploy-plugin-gtk.sh https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          APP_VER=$(node -p "require('./package.json').version")
          cat << EOF >> ~/.cache/tauri/linuxdeploy-plugin-gtk.sh

          # Custom patch: exclude bundled Wayland client libraries so host Mesa/Wayland graphics stack is used instead.
          # This prevents "Could not create default EGL display: EGL_BAD_PARAMETER" white screen crash on modern Wayland environments.
          rm -f "\$APPDIR"/usr/lib/libwayland*.so* "\$APPDIR"/usr/lib/*/libwayland*.so* || true

          # Custom patch: inject X-AppImage-Version into .desktop files so Gear Lever and AppImage integrators display version
          for d in "\$APPDIR"/*.desktop "\$APPDIR"/usr/share/applications/*.desktop; do
            if [ -f "\$d" ] && ! grep -q "X-AppImage-Version" "\$d"; then
              echo "X-AppImage-Version=$APP_VER" >> "\$d"
            fi
          done

          # Custom patch: undo the plugin's GDK_BACKEND=x11 in the hook that ships inside the AppImage.
          # x11 was a workaround for the Wayland backend crashing on the bundled libwayland, which we
          # no longer ship (see patch above). Under XWayland mutter scales the window twice (1280x720
          # arrives as 2560x1514) and claims a 74px decoration frame the window never asked for, so
          # clicks land next to the UI instead of on it.
          # Fail the build rather than ship a silent no-op if the plugin moves its hook.
          gtk_hook="\$APPDIR/apprun-hooks/linuxdeploy-plugin-gtk.sh"
          [ -f "\$gtk_hook" ] || { echo "GTK AppRun hook missing at \$gtk_hook" >&2; exit 1; }
          echo 'unset GDK_BACKEND' >> "\$gtk_hook"
          EOF
          chmod +x ~/.cache/tauri/linuxdeploy-plugin-gtk.sh
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BLOCKFIELD_DISCORD_APPLICATION_ID: ${{ vars.BLOCKFIELD_DISCORD_APPLICATION_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          VITE_BLOCKFIELD_PACK_URL: ${{ vars.VITE_BLOCKFIELD_PACK_URL }}
          VITE_BRAND: ${{ vars.VITE_BRAND || 'BLOCKFIELD' }}
          VITE_BRAND_SUBTITLE: ${{ vars.VITE_BRAND_SUBTITLE || 'КОМАНДНЫЕ БОИ' }}
          VITE_CHROME_TITLE: ${{ vars.VITE_CHROME_TITLE || 'BLOCKFIELD LAUNCHER' }}
          VITE_OPERATION_NAME: ${{ vars.VITE_OPERATION_NAME || 'BLOCKFIELD' }}
          VITE_SEASON: ${{ vars.VITE_SEASON || 'Minecraft 1.21.1 · Fabric' }}
          VITE_SERVER_NAME: ${{ vars.VITE_SERVER_NAME || 'BLOCKFIELD - PRIMARY' }}
          VITE_SERVER_IP: ${{ vars.VITE_SERVER_IP || 'play.blockfield.pro:25565' }}
          VITE_COPYRIGHT: ${{ vars.VITE_COPYRIGHT || '2026 BLOCKFIELD' }}
          BLOCKFIELD_MOJANG_MANIFEST_URL: ${{ vars.BLOCKFIELD_MOJANG_MANIFEST_URL || 'https://piston-meta.mojang.com/mc/game/version_manifest_v2.json' }}
          BLOCKFIELD_MOJANG_ASSET_BASE_URL: ${{ vars.BLOCKFIELD_MOJANG_ASSET_BASE_URL || 'https://resources.download.minecraft.net' }}
          BLOCKFIELD_FABRIC_META_URL: ${{ vars.BLOCKFIELD_FABRIC_META_URL || 'https://meta.fabricmc.net' }}
          BLOCKFIELD_LAUNCHER_NAME: ${{ vars.BLOCKFIELD_LAUNCHER_NAME || 'BlockfieldLauncher' }}
          BLOCKFIELD_MINECRAFT_VERSION: ${{ vars.BLOCKFIELD_MINECRAFT_VERSION || '1.21.1' }}
          BLOCKFIELD_DEFAULT_RAM_MB: ${{ vars.BLOCKFIELD_DEFAULT_RAM_MB || '4096' }}
          BLOCKFIELD_AUTO_UPDATE: ${{ vars.BLOCKFIELD_AUTO_UPDATE || 'true' }}
          BLOCKFIELD_DEFAULT_LANG: ${{ vars.BLOCKFIELD_DEFAULT_LANG || 'en' }}
        with:
          tauriScript: ${{ runner.os == 'macOS' && 'pnpm tauri' || 'just tauri' }}
          args: --config src-tauri/tauri.prod.conf.json ${{ matrix.args }}
          # Empty on main: the cache run builds and signs but creates no release.
          tagName: ${{ github.ref_type == 'tag' && 'launcher-v__VERSION__' || '' }}
          releaseName: Launcher v__VERSION__
          releaseBody: Stable release ${{ github.ref_name }} (${{ github.sha }})
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

  publish-launcher:
    name: Publish launcher release
    if: github.ref_type == 'tag'
    timeout-minutes: 10
    needs: [quality, secret-scan, tauri-release]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10'
      - run: python -I -X utf8 scripts/toolchain.py --ci
      - name: Validate updater assets and publish the completed draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="launcher-v$version"
          test -f "release-notes/$tag.md" || { echo "missing release-notes/$tag.md: prepare it in the release PR"; exit 1; }
          just python scripts/release-notes-tool.py check "release-notes/$tag.md" \
            --repository Blockfield/Blockfield-Launcher --version "$tag" --kind launcher
          mkdir -p release
          gh release download "$tag" --dir release
          just python scripts/prepare-updater.py release "$version"
          gh release upload "$tag" release/latest.json --clobber
          # Имя asset = имя файла; `file#text` задал бы только подпись.
          mkdir -p rn && cp "release-notes/$tag.md" rn/release-notes.md
          if gh release download "$tag" --pattern release-notes.md --output rn/published.md 2>/dev/null \
              && cmp -s rn/published.md rn/release-notes.md; then
            echo "release-notes.md already attached"
          else
            gh release upload "$tag" rn/release-notes.md --clobber
          fi
          gh release edit "$tag" --notes-file rn/release-notes.md --draft=false --latest
