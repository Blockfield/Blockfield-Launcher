name: Native e2e

# Cross-OS end-to-end screen tests and packaging smoke checks for the native
# Slint launcher (Windows and Ubuntu) as a merge/release gate.
# Layer 1 = in-process testing-tree scenarios (`cargo test`, needs SLINT_EMIT_DEBUG_INFO=1).
# Layer 2 = real-window acceptance walk with per-OS golden screenshots (`--e2e`).
on:
  push:
    branches: [native/**, feat/native-slint, next, main]
  pull_request:
    branches: [native/**, feat/native-slint, next, main]
    paths-ignore: ['**.md', 'docs/**', 'release-notes/**']
  workflow_dispatch:
    inputs:
      update_goldens:
        description: 'Write golden candidates instead of comparing (bootstrap only, never gates)'
        required: false
        default: 'false'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Layer 1 drives the Slint testing tree, which needs debug info in the
  # generated code. Metadata only; no pixels change.
  SLINT_EMIT_DEBUG_INFO: 1

jobs:
  # Seconds-long gate before the 2-OS matrix: a fmt/clippy failure fails this
  # one Linux job instead of inside every OS leg.
  lint:
    name: lint (ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: native-lint-ubuntu-24.04
          workspaces: native/app -> target
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/feat/native-slint' || github.ref == 'refs/heads/next' || github.ref == 'refs/heads/main') }}
      - name: Cache apt .deb archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/apt-archives
          key: apt-debs-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageVersion }}-native-lint-${{ hashFiles('scripts/install-linux-deps.sh') }}
          restore-keys: |
            apt-debs-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageVersion }}-native-lint-
            apt-debs-v1-${{ runner.os }}-${{ runner.arch }}-native-lint-
      - name: Linux build libraries
        timeout-minutes: 8
        run: scripts/install-linux-deps.sh libfontconfig-dev libxkbcommon-x11-0
      - name: Format check
        timeout-minutes: 3
        run: |
          cd native/app
          cargo fmt --all -- --check
      - name: Clippy
        timeout-minutes: 25
        run: |
          cd native/app
          cargo clippy --locked --all-targets -- -D warnings

  e2e:
    name: e2e (${{ matrix.name }})
    needs: [lint]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            golden_os: windows
          - name: ubuntu-x86_64
            os: ubuntu-24.04
            golden_os: linux
    defaults:
      run:
        shell: bash
    steps:
      - if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: native-e2e-${{ matrix.os }}
          workspaces: native/app -> target
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/feat/native-slint' || github.ref == 'refs/heads/next' || github.ref == 'refs/heads/main') }}
      - name: Cache apt .deb archives
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/apt-archives
          key: apt-debs-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageVersion }}-native-e2e-${{ hashFiles('scripts/install-linux-deps.sh') }}
          restore-keys: |
            apt-debs-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageVersion }}-native-e2e-
            apt-debs-v1-${{ runner.os }}-${{ runner.arch }}-native-e2e-
      - name: Linux display, packaging and software GL/Vulkan
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: scripts/install-linux-deps.sh xvfb mesa-vulkan-drivers libgl1 libfontconfig-dev libxkbcommon-x11-0 squashfs-tools
      - name: Tests (Layer 1)
        timeout-minutes: 30
        run: |
          cd native/app
          cargo test --locked --profile ci-test
      - name: Build binary (ci-test)
        timeout-minutes: 30
        run: |
          cd native/app
          cargo build --locked --profile ci-test --bin blockfield-native
      - name: Smoke-check Linux .deb and .AppImage packaging
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          version=$(python3 scripts/check-version.py --print)
          out="$RUNNER_TEMP/native-linux-smoke"
          rm -rf "$out"
          deb=$(python3 scripts/package-native-deb.py \
            --binary native/app/target/ci-test/blockfield-native \
            --version "$version" \
            --output "$out")
          dpkg-deb --info "$deb"
          contents=$(dpkg-deb --contents "$deb")
          printf '%s\n' "$contents"
          grep -F './usr/bin/blockfield-launcher' <<<"$contents"
          grep -F './usr/share/applications/blockfield-launcher.desktop' <<<"$contents"
          grep -F './usr/share/icons/hicolor/256x256/apps/blockfield-launcher.png' <<<"$contents"
          appimage=$(python3 scripts/package-native-appimage.py \
            --binary native/app/target/ci-test/blockfield-native \
            --version "$version" \
            --output "$out")
          [ -x "$appimage" ]
          # Verify AppImage executes its bundled binary without FUSE.
          APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --renderer-probe
      - name: Cache NSIS
        if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\Program Files (x86)\NSIS
          key: nsis-v1-${{ runner.os }}-${{ runner.arch }}
      - name: Smoke-check Windows MSI and NSIS packaging
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          nsis_dir="/c/Program Files (x86)/NSIS"
          if ! command -v makensis >/dev/null 2>&1 && [ -f "$nsis_dir/makensis.exe" ]; then
            echo 'C:\Program Files (x86)\NSIS' >> "$GITHUB_PATH"
            export PATH="$nsis_dir:$PATH"
          elif ! command -v makensis >/dev/null 2>&1; then
            choco install nsis --no-progress -y
          fi
          version=$(python scripts/check-version.py --print)
          out="$RUNNER_TEMP/native-win-smoke"
          rm -rf "$out"
          python scripts/package-native-windows.py \
            --binary native/app/target/ci-test/blockfield-native.exe \
            --version "$version" \
            --output "$out"
          ls -la "$out"
          [ -s "$out/blockfield-launcher_${version}_x64_en-US.msi" ]
          [ -s "$out/blockfield-launcher_${version}_x64-setup.exe" ]
      - name: Capture main and settings-skin
        timeout-minutes: 15
        env:
          CARGO_BUILD_JOBS: 4
        run: |
          set -euo pipefail
          cd native/app
          exe=target/ci-test/blockfield-native
          if [ "$RUNNER_OS" = Windows ]; then exe=$exe.exe; fi
          ls -l "$exe"
          if [ "$RUNNER_OS" = Linux ]; then ldd "./$exe" | grep "not found" || echo "ldd: all libs present"; fi
          out=xplat-captures
          rm -rf "$out"
          mkdir -p "$out"
          python3 ../../scripts/native-e2e-runner.py capture --exe "./$exe" --out "$out"
      - name: E2E walk (Layer 2)
        timeout-minutes: 20
        env:
          CARGO_BUILD_JOBS: 4
          SLINT_BACKEND: winit-software
        run: |
          set -euo pipefail
          cd native/app
          exe=target/ci-test/blockfield-native
          if [ "$RUNNER_OS" = Windows ]; then exe=$exe.exe; fi
          out=e2e-out
          rm -rf "$out"
          mkdir -p "$out"
          update=""
          if [ "${{ inputs.update_goldens }}" = "true" ]; then update="--update"; fi
          # shellcheck disable=SC2086
          python3 ../../scripts/native-e2e-runner.py e2e --exe "./$exe" --out "$out" \
            --golden "tests/golden/${{ matrix.golden_os }}" $update
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-${{ runner.os }}-${{ runner.arch }}
          path: native/app/xplat-captures
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure() || inputs.update_goldens == 'true'
        with:
          name: e2e-${{ runner.os }}-${{ runner.arch }}
          path: native/app/e2e-out
          retention-days: 7
