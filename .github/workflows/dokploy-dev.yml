name: Dokploy Dev

on:
  push:
    branches: ['dev']
  workflow_dispatch:

concurrency:
  group: dokploy-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  BACKEND_IMAGE_NAME: ghcr.io/netherg-io/blockfield-launcher-backend
  FILAMENT_IMAGE_NAME: ghcr.io/netherg-io/blockfield-launcher-filament

jobs:
  tauri-release:
    name: Build Windows Tauri release
    runs-on: blacksmith-2vcpu-windows-2025
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> src-tauri/target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri release
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: pnpm tauri:build

      - name: Publish dev release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tauriConf = Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json
          $version = $tauriConf.version

          $exeFiles = @(
            Get-ChildItem -Path target/release/bundle, src-tauri/target/release/bundle -Recurse -File -Filter *.exe -ErrorAction SilentlyContinue |
              Sort-Object FullName
          )
          if ($exeFiles.Count -eq 0) {
            Write-Error "No Windows Tauri .exe bundles found."
            exit 1
          }
          $installer = $exeFiles[0]
          $installerName = $installer.Name

          # ponytail: try .sig from Tauri bundler first, manual sign as fallback
          $sigFiles = @(
            Get-ChildItem -Path target/release/bundle, src-tauri/target/release/bundle -Recurse -File -Filter *.sig -ErrorAction SilentlyContinue
          )
          $signature = ""
          if ($sigFiles.Count -gt 0) {
            $signature = (Get-Content $sigFiles[0].FullName -Raw).Trim()
            Write-Host "Found .sig file: $($sigFiles[0].FullName)"
          } else {
            Write-Warning "No .sig file found — signature will be empty"
          }

          $releaseNotes = "Dev Windows build for $env:GITHUB_SHA"

          $updateJson = @{
            version = $version
            notes = $releaseNotes
            pub_date = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/develop/$installerName"
                signature = $signature
              }
            }
          }
          $updateJson | ConvertTo-Json -Depth 4 | Set-Content update.json
          Write-Host "Generated update.json:"
          Get-Content update.json

          gh release view develop *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit develop --title develop --notes $releaseNotes --prerelease
          } else {
            gh release create develop --title develop --notes $releaseNotes --prerelease --target $env:GITHUB_SHA --latest=false
          }

          $releaseId = gh release view develop --json databaseId --jq .databaseId
          gh api -X PATCH "repos/{owner}/{repo}/releases/$releaseId" `
            -f tag_name=develop `
            -f name=develop `
            -f body="$releaseNotes" `
            -F prerelease=true `
            -F make_latest=false `
            --silent

          gh release view develop --json assets --jq '.assets[].name' | ForEach-Object {
            gh release delete-asset develop $_ -y
          }

          gh release upload develop $($installer.FullName) update.json --clobber

  backend:
    name: Build & deploy backend
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE_NAME }}
          tags: |
            type=raw,value=develop
            type=sha,format=short,prefix=develop-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./server/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Deploy
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_BACKEND_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK_URL" ]; then
            echo "DOKPLOY_BACKEND_WEBHOOK_URL secret is not configured; skipping deploy."
          else
            curl --fail --show-error --silent "$DOKPLOY_WEBHOOK_URL"
          fi

  filament:
    name: Build & deploy Filament
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FILAMENT_IMAGE_NAME }}
          tags: |
            type=raw,value=develop
            type=sha,format=short,prefix=develop-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./server/admin
          file: ./server/admin/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=filament
          cache-to: type=gha,mode=max,scope=filament

      - name: Deploy
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_FILAMENT_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK_URL" ]; then
            echo "DOKPLOY_FILAMENT_WEBHOOK_URL secret is not configured; skipping deploy."
          else
            curl --fail --show-error --silent "$DOKPLOY_WEBHOOK_URL"
          fi
