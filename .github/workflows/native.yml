name: Native e2e

# u18: cross-OS end-to-end screen tests for the Slint POC (Windows and
# Ubuntu) as a merge/release gate. Layer 1 = in-process testing-tree
# scenarios (`cargo test`, needs SLINT_EMIT_DEBUG_INFO=1 below). Layer 2 =
# real-window acceptance walk with per-OS golden screenshots (`--e2e`).
# No secrets, no signing, no releases — artifacts only.
on:
  push:
    # Native e2e runs on integration/release branches so pushes warm the
    # shared Rust cache and gate merges.
    branches: [native/**, feat/native-slint, next, main]
  pull_request:
    # Run on PRs targeting feat/native-slint, next, and main (skipping doc-only edits).
    branches: [feat/native-slint, next, main]
    paths-ignore: ['**.md', 'docs/**', 'release-notes/**']
  workflow_dispatch:
    inputs:
      update_goldens:
        description: 'Write golden candidates instead of comparing (bootstrap only, never gates)'
        required: false
        default: 'false'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Layer 1 drives the Slint testing tree, which needs debug info in the
  # generated code. Metadata only; no pixels change (u18 verified AE=0).
  SLINT_EMIT_DEBUG_INFO: 1

jobs:
  # Seconds-long gate before the 26-minute 3-OS matrix: a fmt/clippy failure
  # fails this one Linux job instead of inside every OS leg.
  lint:
    name: lint (ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # No debuginfo in the dev-profile clippy build: faster linking and a
      # smaller rust-cache (same flag as the standards check job).
      CARGO_PROFILE_DEV_DEBUG: 0
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: native-lint-ubuntu-24.04
          workspaces: native/app -> target
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/feat/native-slint' || github.ref == 'refs/heads/next' || github.ref == 'refs/heads/main') }}
      # Clippy compiles the same crates as the legs, so it needs their
      # system build libraries (fontconfig for yeslogic-fontconfig-sys).
      - name: Cache apt .deb archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/apt-archives
          key: apt-debs-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageVersion }}-native-lint-${{ hashFiles('scripts/install-tauri-deps.sh') }}
          restore-keys: |
            apt-debs-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageVersion }}-native-lint-
            apt-debs-v1-${{ runner.os }}-${{ runner.arch }}-native-lint-
      - name: Linux build libraries
        timeout-minutes: 8
        run: scripts/install-tauri-deps.sh libfontconfig-dev libxkbcommon-x11-0
      - name: Format check
        timeout-minutes: 3
        run: |
          cd native/app
          cargo fmt --all -- --check
      # Debug profile avoids building release artifacts just for lint checks.
      - name: Clippy
        timeout-minutes: 25
        run: |
          cd native/app
          cargo clippy --locked --all-targets -- -D warnings
  e2e:
    name: e2e (${{ matrix.name }})
    needs: [lint]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            golden_os: windows
          - name: ubuntu-x86_64
            os: ubuntu-24.04
            golden_os: linux
    defaults:
      run:
        shell: bash
    steps:
      - if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: native-e2e-${{ matrix.os }}
          workspaces: native/app -> target
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/feat/native-slint' || github.ref == 'refs/heads/next' || github.ref == 'refs/heads/main') }}
      # Ubuntu runners have no display server and no Vulkan ICD: Xvfb for the
      # winit window, lavapipe so the skin3d wgpu preview gets an adapter.
      # winit dlopens libxkbcommon-x11 at window creation (invisible to ldd).
      - name: Cache apt .deb archives
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/apt-archives
          key: apt-debs-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageVersion }}-native-e2e-${{ hashFiles('scripts/install-tauri-deps.sh') }}
          restore-keys: |
            apt-debs-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageVersion }}-native-e2e-
            apt-debs-v1-${{ runner.os }}-${{ runner.arch }}-native-e2e-
      - name: Linux display and software GL/Vulkan
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: scripts/install-tauri-deps.sh xvfb mesa-vulkan-drivers libgl1 libfontconfig-dev libxkbcommon-x11-0
      # Format and clippy gate the matrix via the lint job above; the legs
      # start at Layer 1.
      # Layer 1: headless testing-tree scenarios, no display needed.
      - name: Tests (Layer 1)
        timeout-minutes: 30
        run: |
          cd native/app
          cargo test --locked --profile ci-test
      # Reuse the ci-test profile (workspace opt-level 0, deps opt-level 2) so Layer 2 links
      # against the same compiled dependencies instead of rebuilding under release.
      - name: Build binary (ci-test)
        timeout-minutes: 30
        run: |
          cd native/app
          cargo build --locked --profile ci-test --bin blockfield-native
      - name: Smoke-check Linux .deb packaging
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')
          out="$RUNNER_TEMP/native-deb-smoke"
          rm -rf "$out"
          deb=$(python3 scripts/package-native-deb.py \
            --binary native/app/target/ci-test/blockfield-native \
            --version "$version" \
            --output "$out")
          dpkg-deb --info "$deb"
          contents=$(dpkg-deb --contents "$deb")
          printf '%s\n' "$contents"
          grep -F './usr/bin/blockfield-native' <<<"$contents"
          grep -F './usr/share/applications/blockfield-native.desktop' <<<"$contents"
          grep -F './usr/share/icons/hicolor/256x256/apps/blockfield-native.png' <<<"$contents"
      - name: Cache NSIS
        if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\Program Files (x86)\NSIS
          key: nsis-v1-${{ runner.os }}-${{ runner.arch }}
      - name: Smoke-check Windows MSI and NSIS packaging
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          nsis_dir="/c/Program Files (x86)/NSIS"
          if ! command -v makensis >/dev/null 2>&1 && [ -f "$nsis_dir/makensis.exe" ]; then
            echo 'C:\Program Files (x86)\NSIS' >> "$GITHUB_PATH"
            export PATH="$nsis_dir:$PATH"
          elif ! command -v makensis >/dev/null 2>&1; then
            choco install nsis --no-progress -y
          fi
          version=$(python -c 'import tomllib; print(tomllib.load(open("native/app/Cargo.toml", "rb"))["package"]["version"])')
          out="$RUNNER_TEMP/native-win-smoke"
          rm -rf "$out"
          python scripts/package-native-windows.py \
            --binary native/app/target/ci-test/blockfield-native.exe \
            --version "$version" \
            --output "$out"
          ls -la "$out"
          [ -s "$out/blockfield-native_${version}_x64_en-US.msi" ]
          [ -s "$out/blockfield-native_${version}_x64-setup.exe" ]
      - name: Capture main and settings-skin
        timeout-minutes: 15
        env:
          CARGO_BUILD_JOBS: 4
        run: |
          set -euo pipefail
          cd native/app
          exe=target/ci-test/blockfield-native
          if [ "$RUNNER_OS" = Windows ]; then exe=$exe.exe; fi
          ls -l "$exe"
          # Fail fast with an exact cause if a system .so is missing (Ubuntu).
          if [ "$RUNNER_OS" = Linux ]; then ldd "./$exe" | grep "not found" || echo "ldd: all libs present"; fi
          out=xplat-captures
          rm -rf "$out"
          mkdir -p "$out"
          {
            echo "os=$RUNNER_OS arch=$RUNNER_ARCH"
            uname -a
            rustc -vV | tr '\n' ' '; echo
            grep -A2 'name = "slint"' Cargo.lock | head -3
            grep -A2 'name = "wgpu"' Cargo.lock | head -3
            wc -c "$exe"
          } > "$out/env.txt" 2>&1
          cat "$out/env.txt"
          # Portable 150 s watchdog; the capture quits its own event loop,
          # this only guards hangs.
          cat > "$RUNNER_TEMP/runguarded.py" <<'PYEOF'
          import subprocess, sys
          log, *cmd = sys.argv[1:]
          with open(log, "wb") as f:
              try:
                  p = subprocess.run(cmd, stdout=f, stderr=subprocess.STDOUT, timeout=150)
                  sys.exit(p.returncode)
              except subprocess.TimeoutExpired:
                  f.write(b"\nTIMEOUT after 150s\n")
                  sys.exit(124)
          PYEOF
          # Independent captures (renderer x scale x state, one output dir
          # each): run up to 4 at once, one Xvfb per task on Linux. Env is
          # per-task (never exported) so parallel runs cannot leak into
          # each other.
          cat > "$RUNNER_TEMP/parrun_captures.py" <<'PYEOF'
          import concurrent.futures, os, subprocess, sys, threading
          out, exe, guard = sys.argv[1:4]
          linux = os.environ.get("RUNNER_OS") == "Linux"
          lock = threading.Lock()
          def one(args):
              display, line = args
              renderer, scale, state = line.strip().split("|")
              d = os.path.join(out, renderer, "scale-" + scale, state)
              os.makedirs(d, exist_ok=True)
              env = dict(os.environ)
              env["SLINT_SCALE_FACTOR"] = scale
              if renderer == "software":
                  env["SLINT_BACKEND"] = "winit-software"
              else:
                  env.pop("SLINT_BACKEND", None)
              log = os.path.join(d, "app.log")
              if linux:
                  cmd = ["xvfb-run", "-n", str(display), "-s", "-screen 0 1920x1080x24",
                         "python3", guard, log, exe, "--state", state,
                         "--freeze-motion", "--capture-dir", d]
              else:
                  cmd = ["python3", guard, log, exe, "--state", state,
                         "--freeze-motion", "--capture-dir", d]
              label = f"{renderer} scale={scale} state={state}"
              with lock:
                  print(f"=== {label} ===", flush=True)
              r = subprocess.run(cmd, env=env)
              with lock:
                  print(f"exit={r.returncode} [{label}] (capture asserts panic nonzero on failure)", flush=True)
                  if r.returncode != 0:
                      print(f"--- {d}/app.log (last 3k) ---", flush=True)
                      try:
                          with open(os.path.join(d, "app.log"), "rb") as f:
                              print(f.read()[-3000:].decode("utf-8", "replace"), flush=True)
                      except OSError as e:
                          print(f"(no log: {e})", flush=True)
              return r.returncode
          fail = False
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              for code in pool.map(one, enumerate([l for l in sys.stdin if l.strip()], start=100)):
                  if code != 0:
                      fail = True
          sys.exit(1 if fail else 0)
          PYEOF
          for renderer in default software; do
            for scale in 1 1.5; do
              for state in main settings-skin; do
                printf '%s|%s|%s\n' "$renderer" "$scale" "$state"
              done
            done
          status=0; done | python3 "$RUNNER_TEMP/parrun_captures.py" "$out" "./$exe" "$RUNNER_TEMP/runguarded.py" || status=$?
          # PPM (P6) -> PNG with stdlib only; no ffmpeg/magick on runners.
          python3 - "$out" <<'PYEOF'
          import struct, sys, zlib
          from pathlib import Path
          def chunk(typ, data):
              return (struct.pack(">I", len(data)) + typ + data
                      + struct.pack(">I", zlib.crc32(typ + data) & 0xffffffff))
          def convert(path):
              data = path.read_bytes()
              assert data.startswith(b"P6\n"), path
              header_end = data.index(b"255\n") + 4
              w, h, maxval = (int(x) for x in data[:header_end].split()[1:4])
              assert maxval == 255, path
              raw = data[header_end:]
              assert len(raw) == w * h * 3, (path, len(raw), w, h)
              rows = b"".join(b"\x00" + raw[y * w * 3:(y + 1) * w * 3] for y in range(h))
              png = (b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 2, 0, 0, 0))
                     + chunk(b"IDAT", zlib.compress(rows)) + chunk(b"IEND", b""))
              out = path.with_suffix(".png")
              out.write_bytes(png)
              print(f"{out} {w}x{h}")
              path.unlink()
          for ppm in sorted(Path(sys.argv[1]).rglob("*.ppm")):
              convert(ppm)
          PYEOF
          find "$out" -type f | sort
          exit "$status"
      # Layer 2: real-window acceptance walk against per-OS goldens at 1x.
      # Renderer is pinned to software on every OS: it is the one renderer
      # both runners support (u17: Windows Skia-GL has no GPU and falls
      # back anyway; Ubuntu Skia-GL fails under Xvfb), so one golden set per
      # OS suffices. The e2e log records the backend. Any mismatch, missing
      # element, crash or hang exits non-zero and turns the gate red.
      - name: E2E walk (Layer 2)
        timeout-minutes: 20
        env:
          CARGO_BUILD_JOBS: 4
          SLINT_BACKEND: winit-software
        run: |
          set -euo pipefail
          cd native/app
          exe=target/ci-test/blockfield-native
          if [ "$RUNNER_OS" = Windows ]; then exe=$exe.exe; fi
          out=e2e-out
          rm -rf "$out"
          mkdir -p "$out"
          update=""
          if [ "${{ inputs.update_goldens }}" = "true" ]; then update="--e2e-update-goldens"; fi
          # Independent per-state walks (one output dir each): run up to 4 at
          # once, one Xvfb per task on Linux. State travels per-task in the
          # environment, never exported, so parallel runs cannot leak.
          # New settings tabs rejoin this list with U12 once per-OS goldens exist.
          cat > "$RUNNER_TEMP/parrun_e2e.py" <<'PYEOF'
          import concurrent.futures, os, subprocess, sys, threading
          out, exe, guard, golden = sys.argv[1:5]
          extra = sys.argv[5:]
          linux = os.environ.get("RUNNER_OS") == "Linux"
          lock = threading.Lock()
          def one(args):
              display, line = args
              state = line.strip()
              d = os.path.join(out, state)
              os.makedirs(d, exist_ok=True)
              env = dict(os.environ, BLOCKFIELD_E2E_STATE=state)
              log = os.path.join(d, "app.log")
              if linux:
                  cmd = ["xvfb-run", "-n", str(display), "-s", "-screen 0 1920x1080x24",
                         "python3", guard, log, exe, "--state", state,
                         "--freeze-motion", "--e2e", d,
                         "--e2e-golden", golden, *extra]
              else:
                  cmd = ["python3", guard, log, exe, "--state", state,
                         "--freeze-motion", "--e2e", d,
                         "--e2e-golden", golden, *extra]
              with lock:
                  print(f"=== e2e state={state} ===", flush=True)
              r = subprocess.run(cmd, env=env)
              with lock:
                  print(f"exit={r.returncode} [e2e state={state}]", flush=True)
                  if r.returncode != 0:
                      print(f"--- {d}/app.log (last 3k) ---", flush=True)
                      try:
                          with open(os.path.join(d, "app.log"), "rb") as f:
                              print(f.read()[-3000:].decode("utf-8", "replace"), flush=True)
                      except OSError as e:
                          print(f"(no log: {e})", flush=True)
              return r.returncode
          fail = False
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              for code in pool.map(one, enumerate([l for l in sys.stdin if l.strip()], start=100)):
                  if code != 0:
                      fail = True
          sys.exit(1 if fail else 0)
          PYEOF
          # shellcheck disable=SC2086
          printf '%s\n' main main-launching offline error settings-skin login firstrun update \
            | python3 "$RUNNER_TEMP/parrun_e2e.py" "$out" "./$exe" \
              "$RUNNER_TEMP/runguarded.py" "tests/golden/${{ matrix.golden_os }}" $update
          find "$out" -type f | sort
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-${{ runner.os }}-${{ runner.arch }}
          path: native/app/xplat-captures
          retention-days: 7
      # Screenshots, diffs and logs for every red Layer 2 run.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure() || inputs.update_goldens == 'true'
        with:
          name: e2e-${{ runner.os }}-${{ runner.arch }}
          path: native/app/e2e-out
          retention-days: 7
