[package]
name = "launcher-net"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-only"
description = "Tauri-independent network layer of the Blockfield Launcher (status, pack, download, account and skin engine)"

[dependencies]
launcher-core = { path = "../launcher-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.23"
log = "0.4"
reqwest = { version = "0.13", features = ["gzip", "json", "query", "stream"] }
tokio = { version = "1", features = ["sync", "time", "macros", "net", "io-util", "rt"] }
futures-util = "0.3"
sha2 = "0.11"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
flate2 = "1"
