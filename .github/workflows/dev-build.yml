name: Launcher Dev Build

# Manual only (Actions budget): builds an installable dev launcher for people who do not build Rust.
# The bundle carries its own identifier and game directory, so it installs next to the player one.
# Dev behaviour itself is off until BLOCKFIELD_DEV_BUILD=1, which only this workflow sets.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        default: windows-x86_64
        options: [windows-x86_64, linux-x86_64, macos-aarch64]
      ref:
        description: Branch or tag to build
        type: string
        default: dev

concurrency:
  group: launcher-dev-build-${{ inputs.platform }}-${{ inputs.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Dev launcher (${{ inputs.platform }})
    timeout-minutes: 35
    runs-on: >-
      ${{ inputs.platform == 'windows-x86_64' && 'blacksmith-8vcpu-windows-2025'
      || inputs.platform == 'macos-aarch64' && 'blacksmith-6vcpu-macos-15'
      || 'blacksmith-8vcpu-ubuntu-2204' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: dev-${{ inputs.platform }}
          workspaces: |
            . -> target
            src-tauri -> src-tauri/target
      - name: Linux build deps
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: scripts/install-tauri-deps.sh libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          BLOCKFIELD_DEV_BUILD: '1'
          VITE_BLOCKFIELD_PACK_URL: ${{ vars.VITE_BLOCKFIELD_PACK_URL }}
          VITE_CHROME_TITLE: BLOCKFIELD LAUNCHER DEV
        with:
          args: >-
            --config src-tauri/tauri.dev.conf.json
            ${{ inputs.platform == 'macos-aarch64' && '--target aarch64-apple-darwin' || '' }}
      # A rolling prerelease, not an artifact: Actions artifact storage is shared with every other
      # repository and runs out; release assets do not compete for it and are a plain download link.
      - name: Publish to the rolling dev prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          files=$(find target -type d -name bundle -exec find {} -type f ! -name '*.sig' \; | sort)
          [ -n "$files" ] || { echo "no bundles built"; exit 1; }
          echo "$files"
          gh release view launcher-dev >/dev/null 2>&1 || gh release create launcher-dev \
            --prerelease --title "Dev builds" \
            --notes "Rolling developer builds (BLOCKFIELD_DEV_BUILD=1). Not for players; the updater ignores this repository."
          # shellcheck disable=SC2086
          gh release upload launcher-dev $files --clobber
