name: Prepare isolated legacy cleanup

on:
  push:
    branches: [chore/remove-legacy-api-cms-20260913]
    paths: [.github/workflows/prepare-legacy-cleanup.yml]

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'netherg-io/Blockfield-Launcher' && github.ref == 'refs/heads/chore/remove-legacy-api-cms-20260913'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/remove-legacy-api-cms-20260913
          fetch-depth: 2
      - name: Verify reviewed baseline
        run: test "$(git rev-parse HEAD^)" = '7a342dc2935665779534d2709081c6458e20d77a'
      - name: Apply scoped cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import shutil
          import subprocess
          import textwrap
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one reviewed marker in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1))

          def write(path, text):
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(textwrap.dedent(text).lstrip('\n'))

          baseline = '7a342dc2935665779534d2709081c6458e20d77a'
          Path('/tmp/blockfield-baseline.lock').write_bytes(Path('Cargo.lock').read_bytes())
          replace_once('Cargo.toml', 'members = ["shared", "server", "src-tauri"]', 'members = ["shared", "src-tauri"]')
          package = json.loads(Path('package.json').read_text())
          assert package['scripts'].pop('api:dev') == 'cargo run -p blockfield-server'
          assert package['scripts'].pop('cms:publish-modpack') == 'node server/publish-modpack.mjs'
          package['scripts']['legacy:check'] = 'python3 scripts/check-legacy-cleanup.py'
          Path('package.json').write_text(json.dumps(package, indent=2) + '\n')
          shutil.rmtree('server')

          for name in ('MVP_AUDIT_CLOSURE.md', 'MVP_E2E_SMOKE.md'):
              source = Path('docs') / name
              original = source.read_text()
              target = Path('docs/legacy') / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text('> **Historical document — retired API/CMS architecture.** Not current setup instructions or current test evidence. See [archive notes](README.md) and the [current launcher guide](../../README.md). Paths below describe the baseline commit, not the current tree.\n\n' + original)
              source.unlink()

          write('docs/legacy/README.md', '''
          # Retired API/CMS documentation

          These July 2026 audit and smoke-test documents describe the retired Rust API,
          Laravel/Filament CMS, server-managed accounts, and older release pipeline.
          They are historical evidence, not setup instructions or claims about the
          current static packwiz launcher. Do not run their deployment commands as
          part of current launcher setup.

          The retired source is available in Git history at
          `7a342dc2935665779534d2709081c6458e20d77a`:

          ```sh
          git show 7a342dc2935665779534d2709081c6458e20d77a:server/README.md
          git worktree add --detach ../blockfield-launcher-legacy 7a342dc2935665779534d2709081c6458e20d77a
          ```

          Use a separate worktree only for inspection or an explicitly planned recovery.
          Do not redeploy these services, overwrite installations, or delete data volumes.
          Cleanup removes tracked legacy source; it does not touch running services,
          `/data`, user settings, worlds, packs, releases, or Git history.

          Current documentation: [launcher guide](../../README.md),
          [launcher smoke checklist](../LAUNCHER_SMOKE.md), and
          [rooms and Discord](../ROOMS-AND-DISCORD.md).
          ''')

          readme = Path('README.md').read_text()
          old_note = '> `server/` (API + Filament CMS) is kept in the repo but is no longer deployed or required.'
          assert readme.count(old_note) == 1
          readme = readme.replace(old_note, '> The retired API/CMS source has been removed from the active tree. See [historical notes](docs/legacy/README.md) for recovery from Git history.')
          start = readme.index('Three independent deployable parts:')
          end = readme.index('## CI/CD', start)
          readme = readme[:start] + textwrap.dedent('''
          ## Active components

          | Component | Location | Responsibility |
          | --- | --- | --- |
          | Desktop UI | `src/` | Launcher screens, local identity/settings and UI state |
          | Native launcher | `src-tauri/` | Pack/runtime installation, launching, status, integrations and signed updates |
          | Shared Rust contracts | `shared/` | Types still imported by the native launcher; not a deployed service |
          | Static pack/content host | Separate `blockfield-modpack` repository | `pack.toml`, `index.toml`, `launcher.json`, `content.json` |
          | Launcher update feed | Separate public `blockfield-launcher-releases` repository | Signed bundles and `latest.json`; source stays private |

          ## Local development

          Install the Node.js version from `.nvmrc`, pnpm 11, a compatible stable Rust
          toolchain, and the platform dependencies required by Tauri. Then:

          ```sh
          cp .env.example .env
          pnpm install --frozen-lockfile
          pnpm tauri:dev
          ```

          `VITE_BLOCKFIELD_PACK_URL` points at the static pack directory. Local `.env`
          files stay untracked. No API container, CMS, database, CMS token, or remote
          launcher account is required for this architecture.

          On Linux, `scripts/install-tauri-deps.sh` installs the build dependencies;
          `scripts/rust-env.sh` can use the existing local container-builder fallback.
          For frontend-only development use `pnpm dev` with the existing Tauri mocks.

          ## Content, accounts and integrations

          Modpack/content changes belong in the separate pack repository and its
          publishing workflow, not in this launcher repository. Keep the installer
          and Java artifact hashes in `launcher.json` consistent with the pack.
          Do not use the retired CMS publication workflow.

          The launcher uses local/offline Minecraft identities and the saved nickname.
          This is not proof of ownership of a Microsoft account. Authentication and
          gameplay access rules on the Minecraft server are a separate concern; the
          retired API's HMAC ticket flow is not part of this launcher setup.

          Rooms, deep links and Discord integration remain supported. Follow
          [the current rooms and Discord guide](docs/ROOMS-AND-DISCORD.md).

          ## Validation

          ```sh
          pnpm legacy:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm version:check
          pnpm config:test
          pnpm build
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          ```

          Pull requests run a non-publishing CI workflow. It does not access the
          signing environment, publish release assets, or deploy services.
          Automated tests do not replace the [manual launcher smoke checklist](docs/LAUNCHER_SMOKE.md).
          The [archived API/CMS reports](docs/legacy/README.md) are historical only.

          ''').lstrip('\n') + readme[end:]
          Path('README.md').write_text(readme)
          replace_once('.env.example', '# Directory URL of the packwiz pack: serves pack.toml, launcher.json, content.json and\n# launcher/latest.json (self-updater). Used by both the Vite frontend and the Rust backend.', '# Directory URL of the packwiz pack: serves pack.toml, index.toml, launcher.json and\n# content.json. Used by both Vite and the native Rust launcher. Signed launcher updates\n# use the separate blockfield-launcher-releases repository configured in Tauri.')
          replace_once('.env.example', 'Branding (CMS fallback for the launcher UI)', 'Branding (fallback for static content.json)')
          replace_once('.githooks/pre-commit', 'Rust (backend + API)', 'Rust (native launcher + shared contracts)')
          replace_once('.githooks/pre-commit', 'Rust — backend & API', 'Rust — native launcher & shared contracts')

          write('scripts/check-legacy-cleanup.py', '''
          #!/usr/bin/env python3
          """Guard the static launcher architecture; requires Python 3.11+."""
          import json
          import sys
          import tomllib
          from pathlib import Path

          root = Path(__file__).resolve().parents[1]
          errors = []
          workspace = tomllib.loads((root / 'Cargo.toml').read_text())['workspace']
          members = workspace['members']
          if 'server' in members or (root / 'server').exists():
              errors.append('Retired server source/workspace member has returned.')
          if not {'shared', 'src-tauri'}.issubset(members):
              errors.append('The active native launcher/shared workspace members are missing.')
          scripts = json.loads((root / 'package.json').read_text())['scripts']
          if {'api:dev', 'cms:publish-modpack'}.intersection(scripts):
              errors.append('Retired API/CMS npm entrypoints have returned.')
          if any('blockfield-server' in value or 'server/publish-modpack' in value for value in scripts.values()):
              errors.append('An npm command still targets the retired backend.')
          lock = tomllib.loads((root / 'Cargo.lock').read_text())
          if any(package['name'] == 'blockfield-server' for package in lock['package']):
              errors.append('Cargo.lock still contains the retired workspace package.')
          native = tomllib.loads((root / 'src-tauri/Cargo.toml').read_text())
          if native['dependencies'].get('blockfield-shared', {}).get('path') != '../shared':
              errors.append('The active shared contract dependency must be retained.')
          readme = (root / 'README.md').read_text()
          for stale in ('Three independent deployable parts:', 'VITE_BLOCKFIELD_API_URL', 'pnpm cms:publish-modpack', '## Local server smoke test'):
              if stale in readme:
                  errors.append(f'Active README still contains retired setup instructions: {stale}')
          for relative in ('docs/LAUNCHER_SMOKE.md', 'docs/ROOMS-AND-DISCORD.md', 'docs/legacy/README.md'):
              if not (root / relative).is_file():
                  errors.append(f'Missing current/archive documentation: {relative}')
          if errors:
              print('\\n'.join(errors), file=sys.stderr)
              raise SystemExit(1)
          print('Static launcher boundary verified; active shared contracts preserved.')
          ''')

          write('docs/LAUNCHER_SMOKE.md', '''
          # Static launcher smoke checklist

          This is the current manual checklist for the packwiz launcher. The reports
          in `legacy/` cover a retired architecture and are not evidence for this one.
          Record commit, launcher version, OS/architecture, isolated game directory,
          pack version and sanitized evidence. All scenarios below are **NOT RUN**
          until a tester records an observed result. Do not publish a production
          release or change production services just to test this cleanup.

          Use a disposable Windows profile and Linux profile where supported, a test
          game directory, and an approved test pack/server. Preserve real user data.

          | Scenario | Required observation | Result |
          | --- | --- | --- |
          | Clean preparation | Static metadata loads; Java and installer hashes validate; Fabric/pack/runtime prepare; game starts with the saved local nickname. | NOT RUN |
          | Existing installation | Saved directory, RAM choice, nickname, skins and settings remain; a current installation is reused. | NOT RUN |
          | Verify and update | Startup checking, explicit Verify files and a test pack update work; cancellation or a bad hash does not install partial artifacts or delete files outside the test game directory. | NOT RUN |
          | Network/server failure | Unavailable pack data and an offline game server show real unavailable states, not fake success/counts; retry recovers. | NOT RUN |
          | Game lifecycle | Single-instance handling, overlapping-launch protection, hide/restore, pre/post hooks and exit/crash reporting work. | NOT RUN |
          | Rooms and Discord | Follow ROOMS-AND-DISCORD.md with two accounts; missing Discord does not prevent launching. | NOT RUN |
          | Signed self-update | With an already available approved signed test build, validate signature and install/restart behavior; reject tampering. Do not create a production tag for cleanup validation. | NOT RUN |
          | Native Linux rollback | Verify the opt-in marker, native binary checks, atomic replacement and previous-binary recovery in a disposable installation. | NOT RUN |

          The launcher source remains private. The separate public repository contains
          release assets only. No API/CMS deployment, database account, CMS bearer token
          or server-issued launcher ticket is a prerequisite for this checklist.
          ''')

          write('.github/workflows/ci.yml', '''
          name: Launcher PR checks

          on:
            pull_request:

          permissions:
            contents: read

          concurrency:
            group: launcher-pr-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            quality:
              name: Non-publishing launcher checks
              runs-on: ubuntu-24.04
              timeout-minutes: 30
              steps:
                - uses: actions/checkout@v4
                  with:
                    persist-credentials: false
                - name: Guard legacy cleanup
                  run: python3 scripts/check-legacy-cleanup.py
                - uses: pnpm/action-setup@v4
                  with:
                    version: 11
                - uses: actions/setup-node@v6
                  with:
                    node-version-file: .nvmrc
                    cache: pnpm
                - uses: dtolnay/rust-toolchain@stable
                  with:
                    components: rustfmt, clippy
                - uses: Swatinem/rust-cache@v2
                  with:
                    workspaces: . -> target
                - name: Install Tauri system dependencies
                  timeout-minutes: 8
                  run: scripts/install-tauri-deps.sh libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
                - run: pnpm install --frozen-lockfile
                - run: pnpm lint
                - run: pnpm typecheck
                - run: pnpm test
                - run: pnpm version:check
                - run: pnpm config:test
                - run: pnpm build
                - run: cargo metadata --locked --format-version=1 --no-deps > /dev/null
                - run: cargo fmt --all -- --check
                - run: cargo clippy --workspace --all-targets --locked -- -D warnings
                - run: cargo test --workspace --locked
                - uses: taiki-e/install-action@v2.83.2
                  with:
                    tool: cargo-audit
                    fallback: none
                - run: pnpm audit --audit-level high
                - run: cargo audit
                - name: Confirm lockfiles were not modified
                  run: git diff --exit-code -- Cargo.lock pnpm-lock.yaml
          ''')

          # This temporary preparation workflow must not appear in the final PR.
          Path('.github/workflows/prepare-legacy-cleanup.yml').unlink()
          PY
      - name: Prune the workspace lockfile with Cargo
        run: cargo update --workspace
      - name: Verify dependency preservation and retained application source
        run: |
          python3 - <<'PY'
          import subprocess
          import tomllib
          from pathlib import Path
          before = tomllib.loads(Path('/tmp/blockfield-baseline.lock').read_text())['package']
          after = tomllib.loads(Path('Cargo.lock').read_text())['package']
          def key(p):
              return (p['name'], p['version'], p.get('source', ''), p.get('checksum', ''))
          old = {key(p) for p in before}
          unexpected = {key(p) for p in after} - old
          assert not unexpected, f'Unexpected dependency version/source/checksum changes: {unexpected}'
          changed_source = subprocess.check_output(['git', 'diff', '--name-only', '--', 'src', 'src-tauri', 'shared', '.github/workflows/release.yml', 'docs/ROOMS-AND-DISCORD.md'], text=True)
          assert not changed_source, f'Active application/release/integration files changed: {changed_source}'
          print(f'Cargo pruned {len(before) - len(after)} package entries; retained versions and checksums unchanged.')
          PY
          python3 scripts/check-legacy-cleanup.py
          cargo metadata --locked --format-version=1 --no-deps > /dev/null
          cargo fmt --all -- --check
          bash -n .githooks/pre-commit
          git diff --check
          git diff --stat
          echo 'Remaining legacy references outside the retired stack and historical documents:'
          git grep -n -I -E 'blockfield-server|server/publish-modpack|VITE_BLOCKFIELD_API_URL|CMS_TOKEN|FILAMENT_' -- ':!docs/legacy/**' ':!scripts/check-legacy-cleanup.py' || test "$?" -eq 1
      - name: Commit only the scoped cleanup to its feature branch
        run: |
          git add -A
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          allowed = {'Cargo.toml', 'Cargo.lock', 'package.json', 'README.md', '.env.example', '.githooks/pre-commit', '.github/workflows/ci.yml', '.github/workflows/prepare-legacy-cleanup.yml', 'scripts/check-legacy-cleanup.py', 'docs/LAUNCHER_SMOKE.md', 'docs/MVP_AUDIT_CLOSURE.md', 'docs/MVP_E2E_SMOKE.md'}
          unexpected = [p for p in paths if p not in allowed and not p.startswith(('server/', 'docs/legacy/'))]
          assert not unexpected, f'Unexpected changed paths: {unexpected}'
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove retired API/CMS stack and add isolated launcher PR checks'
          git push origin HEAD:refs/heads/chore/remove-legacy-api-cms-20260913
