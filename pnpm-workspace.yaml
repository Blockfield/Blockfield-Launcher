allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
minimumReleaseAgeExclude:
  - data-urls@8.0.0
  - jsdom@30.1.2
  - lucide-react@1.52.0
  - tr46@7.0.0
  - whatwg-url@17.2.0
patchedDependencies:
  # ponytail: cap brace/paren nesting at 100; drop the patch after upstream fixes CVE-2026-93687.
  braces@3.0.3: patches/braces@3.0.3.patch
audit:
  ignore:
    # Dev Stylelint/micromatch consumes string globs; the mandatory parser patch and installed-chain tests bound AST nesting.
    # Raw AST input is outside this mitigation. Remove this exception with the patch after an upstream fix.
    - GHSA-vfj7-8cjw-p6xm
