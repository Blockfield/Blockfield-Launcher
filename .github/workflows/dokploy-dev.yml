name: Dokploy Dev

on:
  push:
    branches: ['dev']
  workflow_dispatch:

concurrency:
  group: dokploy-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  BACKEND_IMAGE_NAME: ghcr.io/netherg-io/blockfield-launcher-backend
  FILAMENT_IMAGE_NAME: ghcr.io/netherg-io/blockfield-launcher-filament

jobs:
  quality:
    name: Quality gates
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm version:check
      - run: pnpm build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: pnpm audit --audit-level high
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  filament-tests:
    name: Filament tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t blockfield-filament-test server/admin
      - name: Run tests
        run: >-
          docker run --rm --entrypoint php
          -e APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          -e APP_ENV=testing
          -e DB_DATABASE=:memory:
          -e CMS_TOKEN=0123456789abcdef0123456789abcdef
          -e AUTH_SIGNING_KEY=abcdef0123456789abcdef0123456789
          -e RELOAD_TOKEN=reload0123456789abcdef0123456789ab
          -e FILAMENT_ADMIN_EMAIL=admin@example.com
          -e FILAMENT_ADMIN_PASSWORD=test-password-123
          blockfield-filament-test artisan test
      - name: Audit Composer dependencies
        run: docker run --rm --entrypoint composer blockfield-filament-test audit
      - name: Scan Filament image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: blockfield-filament-test
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  secret-scan:
    name: Secret scan
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan Git history
        run: >-
          docker run --rm
          --volume "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          detect --source=/repo --config=/repo/.gitleaks.toml --verbose --redact

  tauri-release:
    name: Build Windows Tauri release
    needs: [quality, filament-tests, secret-scan]
    runs-on: blacksmith-4vcpu-windows-2025
    environment: dev
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> src-tauri/target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate updater signing secrets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_PRIVATE_KEY is required"
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "TAURI_KEY_PASSWORD is required"
          }

      - name: Build Tauri release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          # Frontend (Vite) — VITE_* vars consumed at build time by Vite/Vite
          VITE_BLOCKFIELD_API_URL: ${{ vars.VITE_BLOCKFIELD_API_URL || 'http://localhost:3000/api/launcher/v1' }}
          VITE_BRAND: ${{ vars.VITE_BRAND || 'BLOCKFIELD' }}
          VITE_BRAND_SUBTITLE: ${{ vars.VITE_BRAND_SUBTITLE || 'TACTICAL OPS' }}
          VITE_CHROME_TITLE: ${{ vars.VITE_CHROME_TITLE || 'BLOCKFIELD LAUNCHER' }}
          VITE_OPERATION_NAME: ${{ vars.VITE_OPERATION_NAME || 'IRON FRONT' }}
          VITE_SEASON: ${{ vars.VITE_SEASON || '/ SEASON 01' }}
          VITE_SERVER_NAME: ${{ vars.VITE_SERVER_NAME || 'BLOCKFIELD - PRIMARY' }}
          VITE_SERVER_IP: ${{ vars.VITE_SERVER_IP || 'play.blockfield.gg:25565' }}
          VITE_COPYRIGHT: ${{ vars.VITE_COPYRIGHT || '2026 BLOCKFIELD COMMAND' }}
          VITE_LOGIN_PLACEHOLDER: ${{ vars.VITE_LOGIN_PLACEHOLDER || 'operator@blockfield.gg' }}
          # Backend (Rust) — BLOCKFIELD_* vars consumed at build+run time by src-tauri
          BLOCKFIELD_MOJANG_MANIFEST_URL: ${{ vars.BLOCKFIELD_MOJANG_MANIFEST_URL || 'https://piston-meta.mojang.com/mc/game/version_manifest_v2.json' }}
          BLOCKFIELD_MOJANG_ASSET_BASE_URL: ${{ vars.BLOCKFIELD_MOJANG_ASSET_BASE_URL || 'https://resources.download.minecraft.net' }}
          BLOCKFIELD_LAUNCHER_NAME: ${{ vars.BLOCKFIELD_LAUNCHER_NAME || 'BlockfieldLauncher' }}
          BLOCKFIELD_MINECRAFT_VERSION: ${{ vars.BLOCKFIELD_MINECRAFT_VERSION || '1.20.1' }}
          BLOCKFIELD_DEFAULT_RAM_MB: ${{ vars.BLOCKFIELD_DEFAULT_RAM_MB || '8192' }}
          BLOCKFIELD_AUTO_UPDATE: ${{ vars.BLOCKFIELD_AUTO_UPDATE || 'true' }}
          BLOCKFIELD_DEFAULT_LANG: ${{ vars.BLOCKFIELD_DEFAULT_LANG || 'en' }}
        run: pnpm tauri:build

      - name: Publish dev release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $package = Get-Content package.json | ConvertFrom-Json
          $version = $package.version

          $exeFiles = @(
            Get-ChildItem -Path target/release/bundle, src-tauri/target/release/bundle -Recurse -File -Filter *.exe -ErrorAction SilentlyContinue |
              Sort-Object FullName
          )
          if ($exeFiles.Count -eq 0) {
            Write-Error "No Windows Tauri .exe bundles found."
            exit 1
          }
          $installer = $exeFiles[0]
          $installerName = $installer.Name

          # ponytail: try .sig from Tauri bundler first, manual sign as fallback
          $signatureFile = "$($installer.FullName).sig"
          if (-not (Test-Path -LiteralPath $signatureFile)) {
            throw "No updater signature found for $installerName"
          }
          $signature = (Get-Content -LiteralPath $signatureFile -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($signature)) {
            throw "Updater signature is empty"
          }
          Write-Host "Found matching .sig file: $signatureFile"

          $releaseNotes = "Dev Windows build for $env:GITHUB_SHA"

          $updateJson = @{
            version = $version
            notes = $releaseNotes
            pub_date = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/develop/$installerName"
                signature = $signature
              }
            }
          }
          $updateJson | ConvertTo-Json -Depth 4 | Set-Content update.json
          $validated = Get-Content update.json -Raw | ConvertFrom-Json
          $platform = $validated.platforms.'windows-x86_64'
          if ($validated.version -ne $version -or
              [string]::IsNullOrWhiteSpace($platform.url) -or
              [string]::IsNullOrWhiteSpace($platform.signature)) {
            throw "Generated updater metadata is invalid"
          }
          Write-Host "Generated update.json:"
          Get-Content update.json

          $artifactDir = Join-Path $env:RUNNER_TEMP 'blockfield-updater'
          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null
          Copy-Item $installer.FullName $artifactDir
          Copy-Item update.json $artifactDir

          # Force develop tag to current commit — gh release edit doesn't move the tag
          git tag -f develop $env:GITHUB_SHA
          git push origin develop -f

          # Always delete and recreate so the release points to the new commit
          gh release delete develop -y 2>$null
          gh release create develop `
            --title develop `
            --notes $releaseNotes `
            --prerelease `
            --target $env:GITHUB_SHA `
            --latest=false `
            $($installer.FullName) update.json

      - name: Upload signed updater bundle
        uses: actions/upload-artifact@v4
        with:
          name: signed-updater-bundle
          path: ${{ runner.temp }}/blockfield-updater
          if-no-files-found: error

  backend:
    name: Build & deploy backend
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE_NAME }}
          tags: |
            type=raw,value=develop
            type=sha,format=short,prefix=develop-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./server/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Deploy
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_BACKEND_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK_URL" ]; then
            echo "DOKPLOY_BACKEND_WEBHOOK_URL secret is not configured; skipping deploy."
          else
            curl --fail --show-error --silent "$DOKPLOY_WEBHOOK_URL"
          fi

  updater-backend:
    name: Publish signed updater backend
    needs: [backend, tauri-release]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download signed updater bundle
        uses: actions/download-artifact@v4
        with:
          name: signed-updater-bundle
          path: server/updates

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE_NAME }}
          tags: |
            type=raw,value=develop
            type=sha,format=short,prefix=develop-

      - name: Build and push signed updater image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./server/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Deploy signed updater image
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_BACKEND_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK_URL" ]; then
            echo "DOKPLOY_BACKEND_WEBHOOK_URL secret is not configured; skipping deploy."
          else
            curl --fail --show-error --silent "$DOKPLOY_WEBHOOK_URL"
          fi

  filament:
    name: Build & deploy Filament
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FILAMENT_IMAGE_NAME }}
          tags: |
            type=raw,value=develop
            type=sha,format=short,prefix=develop-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./server/admin
          file: ./server/admin/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=filament
          cache-to: type=gha,mode=max,scope=filament

      - name: Deploy
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_FILAMENT_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK_URL" ]; then
            echo "DOKPLOY_FILAMENT_WEBHOOK_URL secret is not configured; skipping deploy."
          else
            curl --fail --show-error --silent "$DOKPLOY_WEBHOOK_URL"
          fi
