name: Launcher DEV

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: launcher-dev-${{ github.ref }}
  # Runs share one prerelease; a cancelled run could still upload over a newer one.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    if: github.ref == 'refs/heads/dev'
    name: DEV launcher (${{ matrix.name }})
    timeout-minutes: 60
    # No `environment: dev`: its signing secrets stay limited to main and release tags,
    # and DEV bundles create no updater artifacts.
    runs-on: ${{ matrix.os }}
    env:
      BLOCKFIELD_DEV_BUILD: '1'
      VITE_BLOCKFIELD_PACK_URL: ${{ vars.VITE_BLOCKFIELD_PACK_URL }}
      VITE_BLOCKFIELD_WORKSHOP_PACK_URL: ${{ vars.VITE_BLOCKFIELD_WORKSHOP_PACK_URL }}
      BLOCKFIELD_DISCORD_APPLICATION_ID: ${{ vars.BLOCKFIELD_DISCORD_APPLICATION_ID }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            installers: deb|AppImage
          - name: windows-x86_64
            os: windows-2025
            installers: msi|exe
    steps:
      - if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Cache pinned project tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/quality
            .dev/jdk
          key: quality-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/toolchain.py', 'scripts/quality.py', 'scripts/package-native-appimage.py') }}
      - run: python -I -X utf8 scripts/toolchain.py --ci
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Reuse the release dependency cache; Cargo rebuilds the DEV launcher itself.
          shared-key: native-release-${{ matrix.os }}
          workspaces: native/app -> target
          cache-on-failure: true
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: scripts/install-linux-deps.sh libfontconfig-dev libxkbcommon-x11-0 squashfs-tools
      - name: Cache NSIS on Windows
        if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\Program Files (x86)\NSIS
          key: nsis-v1-${{ runner.os }}-${{ runner.arch }}
      - name: Ensure NSIS on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nsis = 'C:\Program Files (x86)\NSIS'
          if ((Get-Command makensis -ErrorAction SilentlyContinue) -or (Test-Path "$nsis\makensis.exe")) {
            if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
              Add-Content -Path $env:GITHUB_PATH -Value $nsis
            }
          } else {
            choco install nsis --no-progress -y
          }
      - run: just version-check
      - run: just config-check
      - name: Build native DEV launcher
        shell: bash
        run: |
          set -euo pipefail
          cd native/app
          cargo build --locked --release --bin blockfield-native
      - name: Package Linux DEV installers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version=$(just python scripts/check-version.py --print)
          mkdir -p dist-dev
          just python scripts/package-native-deb.py \
            --dev \
            --binary native/app/target/release/blockfield-native \
            --version "$version" \
            --output dist-dev
          just python scripts/package-native-appimage.py \
            --dev \
            --binary native/app/target/release/blockfield-native \
            --version "$version" \
            --output dist-dev
      - name: Package Windows DEV installers
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version=$(just python scripts/check-version.py --print)
          mkdir -p dist-dev
          just python scripts/package-native-windows.py \
            --dev \
            --binary native/app/target/release/blockfield-native.exe \
            --version "$version" \
            --output dist-dev
      # Release assets are direct downloads and do not consume Actions artifact storage.
      # Every run shares one version, so asset names carry the source commit.
      - name: Upload DEV installers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSTALLERS: ${{ matrix.installers }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          out_dir="$RUNNER_TEMP/dev-upload"
          rm -rf "$out_dir"
          mkdir -p "$out_dir"
          files=()
          shopt -s nullglob
          for src in dist-dev/*; do
            base=$(basename "$src")
            ext="${base##*.}"
            stem="${base%.*}"
            dest="$out_dir/${stem}-${short_sha}.${ext}"
            cp "$src" "$dest"
            files+=("$dest")
          done
          [ "${#files[@]}" -gt 0 ] || { echo 'No DEV installers built'; exit 1; }
          # Another platform may create the rolling prerelease first.
          gh release view launcher-dev >/dev/null 2>&1 || gh release create launcher-dev \
            --target "$GITHUB_SHA" --prerelease --latest=false --title 'Launcher DEV' \
            --notes 'Test launcher built from dev. Version matches main; stable auto-updates are disabled. Installer names end with the source commit.' \
            || gh release view launcher-dev >/dev/null
          gh release upload launcher-dev "${files[@]}" --clobber
          # Drop this platform's older installers only once the new ones are downloadable.
          gh release view launcher-dev --json assets \
            --jq ".assets[].name | select(test(\"\\\\.($INSTALLERS)\$\") and (contains(\"-$short_sha.\") | not))" |
            while IFS= read -r old; do gh release delete-asset launcher-dev "$old" --yes; done
