[package]
name = "blockfield-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
description = "Blockfield Launcher API server — serves modpack manifest and files"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.6", features = ["cors", "fs"] }
sha2 = "0.10"
zip = "4"
walkdir = "2"
blockfield-shared = { path = "../shared" }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
