[package]
name = "blockfield-native"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"
build = "build.rs"

[workspace]

[dependencies]
launcher-app = { path = "../../core/launcher-app" }
launcher-core = { path = "../../core/launcher-core" }
launcher-net = { path = "../../core/launcher-net" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
dirs = "7"
serde_json = "1.0"
slint = { version = "~1.18", default-features = false, features = ["std", "backend-winit", "renderer-skia-opengl", "renderer-software", "compat-1-2"] }
skin3d = { path = "../skin3d", features = ["slint"] }
# e2e golden PNG decode/encode. Same spec as skin3d's: no new code to compile.
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
# Headless Slint testing backend for Layer 1 (ElementHandle tree driving).
i-slint-backend-testing = "1.18.1"

[build-dependencies]
slint-build = "~1.18"

[profile.release]
lto = "thin"
strip = true
