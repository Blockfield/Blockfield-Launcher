[package]
name = "blockfield-native-poc"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"
build = "build.rs"

[workspace]

[dependencies]
slint = { version = "~1.18", default-features = false, features = ["std", "backend-winit", "renderer-skia-opengl", "renderer-software", "compat-1-2"] }

[build-dependencies]
slint-build = "~1.18"

[profile.release]
lto = "thin"
strip = true
