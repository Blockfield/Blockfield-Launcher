name: Dokploy Dev Backend

on:
  push:
    branches: ['dev']
  workflow_dispatch:

concurrency:
  group: dokploy-dev-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/netherg-io/blockfield-launcher-backend

jobs:
  tauri-release:
    name: Build Windows Tauri release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> src-tauri/target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri release
        run: pnpm tauri:build

      - name: Publish dev release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $releaseNotes = "Dev Windows build for $env:GITHUB_SHA"
          $files = @(
            Get-ChildItem -Path target/release/bundle, src-tauri/target/release/bundle -Recurse -File -Filter *.exe -ErrorAction SilentlyContinue |
              Sort-Object FullName |
              Select-Object -ExpandProperty FullName
          )
          if ($files.Count -eq 0) {
            Write-Error "No Windows Tauri .exe bundles found."
            exit 1
          }

          gh release view dev *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit dev --title dev --notes $releaseNotes --prerelease
          } else {
            gh release create dev --title dev --notes $releaseNotes --prerelease --target $env:GITHUB_SHA --latest=false
          }

          $releaseId = gh release view dev --json databaseId --jq .databaseId
          gh api -X PATCH "repos/{owner}/{repo}/releases/$releaseId" `
            -f tag_name=dev `
            -f name=dev `
            -f body="$releaseNotes" `
            -F prerelease=true `
            -F make_latest=false `
            --silent

          gh release view dev --json assets --jq '.assets[].name' | ForEach-Object {
            gh release delete-asset dev $_ -y
          }

          gh release upload dev @files --clobber

  build-push-deploy:
    name: Build, push, deploy
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev
            type=sha,format=short,prefix=dev-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./server/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Dokploy deployment
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK_URL" ]; then
            echo "DOKPLOY_WEBHOOK_URL secret is not configured; image was pushed only."
            exit 0
          fi

          curl --fail --show-error --silent "$DOKPLOY_WEBHOOK_URL"
