services:
  filament:
    build:
      context: ./admin
    ports:
      - "8055:8055"
    volumes:
      - filament-data:/data
    environment:
      APP_URL: ${FILAMENT_APP_URL:-http://localhost:8055}
      APP_KEY: ${FILAMENT_APP_KEY:-}
      CMS_TOKEN: ${CMS_TOKEN:-blockfield-dev-token}
      FILAMENT_ADMIN_EMAIL: ${FILAMENT_ADMIN_EMAIL:-admin@example.com}
      FILAMENT_ADMIN_PASSWORD: ${FILAMENT_ADMIN_PASSWORD:-admin}
    restart: unless-stopped

  blockfield-api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    depends_on:
      filament:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./files:/data/files          # Drop new ZIPs here, POST /api/launcher/v1/reload
      - extracted:/data/extracted    # Auto-populated cache from ZIP on startup/reload
    environment:
      - BASE_URL=${BASE_URL:-https://play.blockfield.gg}
      - MODPACK_VERSION=${MODPACK_VERSION:-0.1.43}
      - MINECRAFT_VERSION=${MINECRAFT_VERSION:-1.20.1}
      - BIND_HOST=${BIND_HOST:-0.0.0.0}
      - PORT=${PORT:-3000}
      - API_PREFIX=${API_PREFIX:-api/launcher/v1}
      - FALLBACK_BRAND=${FALLBACK_BRAND:-BLOCKFIELD}
      - FALLBACK_BRAND_SUBTITLE=${FALLBACK_BRAND_SUBTITLE:-TACTICAL OPS}
      - FALLBACK_CHROME_TITLE=${FALLBACK_CHROME_TITLE:-BLOCKFIELD LAUNCHER}
      - FALLBACK_OPERATION_NAME=${FALLBACK_OPERATION_NAME:-IRON FRONT}
      - FALLBACK_SERVER_IP=${FALLBACK_SERVER_IP:-play.blockfield.gg:25565}
      - FALLBACK_LAUNCHER_VERSION=${FALLBACK_LAUNCHER_VERSION:-0.4.2}
      - FALLBACK_UPDATE_URL=${FALLBACK_UPDATE_URL:-https://play.blockfield.gg/downloads/blockfield-launcher_0.1.0_x64-setup.exe}
      - CMS_URL=http://filament:8055/api
      - CMS_TOKEN=${CMS_TOKEN:-blockfield-dev-token}
      - CMS_REQUIRED=${CMS_REQUIRED:-false}
      - CMS_MODPACK_COLLECTION=${CMS_MODPACK_COLLECTION:-modpack_releases}
      - CMS_CONTENT_COLLECTION=${CMS_CONTENT_COLLECTION:-launcher_content}
      - CMS_UPDATE_COLLECTION=${CMS_UPDATE_COLLECTION:-launcher_updates}
    restart: unless-stopped

volumes:
  filament-data:
  extracted:
