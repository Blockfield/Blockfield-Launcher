name: Finish isolated legacy cleanup

on:
  push:
    branches: [chore/remove-legacy-api-cms-20260913]
    paths: [.github/workflows/finish-legacy-cleanup.yml]

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'netherg-io/Blockfield-Launcher' && github.ref == 'refs/heads/chore/remove-legacy-api-cms-20260913'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/remove-legacy-api-cms-20260913
          fetch-depth: 0
      - name: Verify unchanged application baseline and reviewed preparation source
        run: |
          test "$(git hash-object .github/workflows/prepare-legacy-cleanup.yml)" = 'ec18f726b18342f5645becb438347e9ed26783df'
          test -z "$(git diff --name-only 7a342dc2935665779534d2709081c6458e20d77a HEAD -- . ':!.github/workflows/**')"
      - name: Apply only reviewed non-workflow changes
        run: |
          python3 - <<'PY'
          import textwrap
          from pathlib import Path
          lines = Path('.github/workflows/prepare-legacy-cleanup.yml').read_text().splitlines()
          start = lines.index("          python3 - <<'PY'") + 1
          end = lines.index('          PY', start)
          script = textwrap.dedent('\n'.join(lines[start:end]))
          # The direct connector already created the PR workflow. GITHUB_TOKEN
          # writes only source/docs/lockfile, never any workflow configuration.
          stop = script.index("write('.github/workflows/ci.yml',")
          exec(compile(script[:stop], '<reviewed-scoped-cleanup>', 'exec'))
          PY
      - name: Prune the workspace lockfile with Cargo
        run: cargo update --workspace
      - name: Verify exact dependency preservation and retained source
        run: |
          python3 - <<'PY'
          import subprocess
          import tomllib
          from pathlib import Path
          before = tomllib.loads(Path('/tmp/blockfield-baseline.lock').read_text())['package']
          after = tomllib.loads(Path('Cargo.lock').read_text())['package']
          def key(p):
              return (p['name'], p['version'], p.get('source', ''), p.get('checksum', ''))
          assert not ({key(p) for p in after} - {key(p) for p in before}), 'Unexpected dependency changes'
          source = subprocess.check_output(['git', 'diff', '--name-only', '--', 'src', 'src-tauri', 'shared', '.github/workflows', 'docs/ROOMS-AND-DISCORD.md'], text=True)
          assert not source, f'Active source or workflow changed: {source}'
          print(f'Removed {len(before) - len(after)} Cargo package entries with no new versions or changed checksums.')
          PY
          python3 scripts/check-legacy-cleanup.py
          cargo metadata --locked --format-version=1 --no-deps > /dev/null
          cargo fmt --all -- --check
          bash -n .githooks/pre-commit
          git diff --check
      - name: Commit only source cleanup to the feature branch
        run: |
          git add -A
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          allowed = {'Cargo.toml', 'Cargo.lock', 'package.json', 'README.md', '.env.example', '.githooks/pre-commit', 'scripts/check-legacy-cleanup.py', 'docs/LAUNCHER_SMOKE.md', 'docs/MVP_AUDIT_CLOSURE.md', 'docs/MVP_E2E_SMOKE.md'}
          unexpected = [p for p in paths if p not in allowed and not p.startswith(('server/', 'docs/legacy/'))]
          assert not unexpected, f'Unexpected changed paths: {unexpected}'
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove retired API/CMS source and align static launcher documentation'
          git push origin HEAD:refs/heads/chore/remove-legacy-api-cms-20260913
