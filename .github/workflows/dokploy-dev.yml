name: Dokploy Dev

on:
  push:
    branches: ['dev']
  workflow_dispatch:

concurrency:
  group: dokploy-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  BACKEND_IMAGE_NAME: ghcr.io/netherg-io/blockfield-launcher-backend
  FILAMENT_IMAGE_NAME: ghcr.io/netherg-io/blockfield-launcher-filament

jobs:
  quality:
    name: Quality gates
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - uses: taiki-e/install-action@v2.83.2
        with:
          tool: cargo-audit
          fallback: none
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm version:check
      - run: pnpm build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: pnpm audit --audit-level high
      - run: cargo audit

  filament-tests:
    name: Filament tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t blockfield-filament-test server/admin
      - name: Run tests
        run: >-
          docker run --rm --entrypoint php
          -e APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          -e APP_ENV=testing
          -e DB_DATABASE=:memory:
          -e CMS_TOKEN=0123456789abcdef0123456789abcdef
          -e AUTH_SIGNING_KEY=abcdef0123456789abcdef0123456789
          -e RELOAD_TOKEN=reload0123456789abcdef0123456789ab
          -e FILAMENT_ADMIN_EMAIL=admin@example.com
          -e FILAMENT_ADMIN_PASSWORD=test-password-123
          blockfield-filament-test artisan test
      - name: Audit Composer dependencies
        run: docker run --rm --entrypoint composer blockfield-filament-test audit
      - name: Scan Filament image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: blockfield-filament-test
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  secret-scan:
    name: Secret scan
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan Git history
        run: >-
          docker run --rm
          --volume "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          detect --source=/repo --config=/repo/.gitleaks.toml --verbose --redact

  tauri-release:
    name: Build launcher (${{ matrix.name }})
    needs: [quality, secret-scan]
    environment: dev
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            args: ''
          - name: windows-x86_64
            os: windows-latest
            args: ''
          - name: macos-universal
            os: macos-latest
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> src-tauri/target
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm config:check
        env:
          VITE_BLOCKFIELD_PACK_URL: ${{ vars.VITE_BLOCKFIELD_PACK_URL }}
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          VITE_BLOCKFIELD_PACK_URL: ${{ vars.VITE_BLOCKFIELD_PACK_URL }}
          VITE_BRAND: ${{ vars.VITE_BRAND || 'BLOCKFIELD' }}
          VITE_BRAND_SUBTITLE: ${{ vars.VITE_BRAND_SUBTITLE || 'TACTICAL OPS' }}
          VITE_CHROME_TITLE: ${{ vars.VITE_CHROME_TITLE || 'BLOCKFIELD LAUNCHER' }}
          VITE_OPERATION_NAME: ${{ vars.VITE_OPERATION_NAME || 'IRON FRONT' }}
          VITE_SEASON: ${{ vars.VITE_SEASON || '/ SEASON 01' }}
          VITE_SERVER_NAME: ${{ vars.VITE_SERVER_NAME || 'BLOCKFIELD - PRIMARY' }}
          VITE_SERVER_IP: ${{ vars.VITE_SERVER_IP || 'minecraft.play.nether.pp.ua:25565' }}
          VITE_COPYRIGHT: ${{ vars.VITE_COPYRIGHT || '2026 BLOCKFIELD COMMAND' }}
          BLOCKFIELD_MOJANG_MANIFEST_URL: ${{ vars.BLOCKFIELD_MOJANG_MANIFEST_URL || 'https://piston-meta.mojang.com/mc/game/version_manifest_v2.json' }}
          BLOCKFIELD_MOJANG_ASSET_BASE_URL: ${{ vars.BLOCKFIELD_MOJANG_ASSET_BASE_URL || 'https://resources.download.minecraft.net' }}
          BLOCKFIELD_LAUNCHER_NAME: ${{ vars.BLOCKFIELD_LAUNCHER_NAME || 'BlockfieldLauncher' }}
          BLOCKFIELD_MINECRAFT_VERSION: ${{ vars.BLOCKFIELD_MINECRAFT_VERSION || '1.20.1' }}
          BLOCKFIELD_DEFAULT_RAM_MB: ${{ vars.BLOCKFIELD_DEFAULT_RAM_MB || '8192' }}
          BLOCKFIELD_AUTO_UPDATE: ${{ vars.BLOCKFIELD_AUTO_UPDATE || 'true' }}
          BLOCKFIELD_DEFAULT_LANG: ${{ vars.BLOCKFIELD_DEFAULT_LANG || 'en' }}
        with:
          tauriScript: pnpm tauri
          args: --config src-tauri/tauri.prod.conf.json ${{ matrix.args }}
          tagName: launcher-v__VERSION__
          releaseName: Launcher v__VERSION__
          releaseBody: Dev build for ${{ github.sha }}
          includeUpdaterJson: true

  publish-launcher:
    # The source repo is private, so its release assets are unusable by the Tauri updater.
    # Mirror bundles + latest.json into the public releases repo (https://github.com/netherg-io/blockfield-launcher-releases).
    name: Publish launcher release
    needs: [tauri-release]
    runs-on: ubuntu-22.04
    environment: dev
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download build assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mkdir -p release
          gh release download "launcher-v$version" --dir release
          python3 - "$version" <<'EOF'
          import json, sys
          version = sys.argv[1]
          base = "https://github.com/netherg-io/blockfield-launcher-releases/releases/download/launcher-v" + version + "/"
          path = "release/latest.json"
          data = json.load(open(path))
          for platform in data["platforms"].values():
              platform["url"] = base + platform["url"].rsplit("/", 1)[-1]
          json.dump(data, open(path, "w"), indent=2)
          print(json.dumps(data["platforms"], indent=1))
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          repository: netherg-io/blockfield-launcher-releases
          token: ${{ secrets.RELEASES_TOKEN }} # PAT with contents:write on the releases repo
          tag_name: launcher-v${{ env.VERSION }}
          name: Launcher v${{ env.VERSION }}
          body: Built from ${{ github.repository }}@${{ github.sha }}
          files: release/*
