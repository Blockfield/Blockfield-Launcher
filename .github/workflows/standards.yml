name: Code standards
on:
  push:
    branches: [main, next, feat/native-slint]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['**.md', 'docs/**', 'release-notes/**']
  workflow_dispatch:
    inputs:
      reason:
        description: 'Override reason (maintainers only)'
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read # PR runs read base metadata only; no secrets are used
  actions: read # same-tree lookup reads earlier runs and their artifacts
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    name: Check (${{ matrix.os }})
    if: always()
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check for green run of the same tree
        id: same
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree=$(git rev-parse "HEAD^{tree}")
          tested=false
          for sha in $(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/standards.yml/runs?status=success&per_page=30" --jq '.workflow_runs[] | select(.event == "push") | .head_sha'); do
            t=$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${sha}" --jq '.tree.sha')
            if [ "$t" = "$tree" ]; then tested=true; break; fi
          done
          if [ "$tested" != true ]; then
            for id in $(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/standards.yml/runs?event=pull_request&branch=next&status=success&per_page=20" --jq ".workflow_runs[] | select(.head_repository.full_name == \"${GITHUB_REPOSITORY}\") | .id" || true); do
              if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/artifacts?per_page=100" --jq '.artifacts[].name' 2>/dev/null | grep -qx "tested-tree-${tree}"; then tested=true; break; fi
            done
          fi
          echo "Same tree $tree already tested: $tested."
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.same.outputs.tested != 'true'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.same.outputs.tested != 'true'
        with:
          node-version: '24.21.0'
      - name: Cache pinned project tools
        if: steps.same.outputs.tested != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/quality
            .dev/jdk
          key: quality-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/toolchain.py', 'scripts/quality.py', 'dev/quality.py') }}
      - if: steps.same.outputs.tested != 'true'
        run: python -I -X utf8 scripts/toolchain.py --ci
      - if: steps.same.outputs.tested != 'true'
        run: rustup component add --toolchain 1.99.0 rustfmt clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.same.outputs.tested != 'true'
        with:
          shared-key: standards-${{ matrix.os }}
          workspaces: . -> target
          save-if: ${{ github.event_name == 'push' }}
      - if: steps.same.outputs.tested != 'true'
        run: just setup
      - name: Check Rust, scripts and configuration
        if: steps.same.outputs.tested != 'true'
        run: just check
      - name: Check launcher version
        if: steps.same.outputs.tested != 'true'
        run: just version-check
      - name: Record tested tree
        id: tree
        if: runner.os == 'Linux' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          tree=$(git rev-parse "HEAD^{tree}")
          echo "$tree" > tested-tree.txt
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
      - name: Upload tested tree
        if: runner.os == 'Linux' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-tree-${{ steps.tree.outputs.tree }}
          path: tested-tree.txt
          retention-days: 7
          if-no-files-found: error
