name: Launcher DEV

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: launcher-dev-${{ github.ref }}
  # Runs share one prerelease; a cancelled run could still upload over a newer one.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    if: github.ref == 'refs/heads/dev'
    name: DEV launcher (${{ matrix.name }})
    timeout-minutes: 60
    # No `environment: dev`: its signing secrets stay limited to main and release tags,
    # and DEV bundles create no updater artifacts.
    runs-on: ${{ matrix.os }}
    env:
      BLOCKFIELD_DEV_BUILD: '1'
      VITE_BLOCKFIELD_PACK_URL: ${{ vars.VITE_BLOCKFIELD_PACK_URL }}
      BLOCKFIELD_DISCORD_APPLICATION_ID: ${{ vars.BLOCKFIELD_DISCORD_APPLICATION_ID }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            installers: deb|rpm|AppImage
          - name: windows-x86_64
            os: windows-2025
            installers: msi|exe
    steps:
      - if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.9.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Reuse the release dependency cache; Cargo rebuilds the DEV launcher itself.
          key: github-${{ matrix.os }}-${{ matrix.name }}
          workspaces: |
            . -> target
            src-tauri -> src-tauri/target
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: scripts/install-tauri-deps.sh libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm version:check
      - run: pnpm config:check
      - name: Patch linuxdeploy GTK plugin for Wayland compatibility and metadata
        if: runner.os == 'Linux'
        run: scripts/patch-linuxdeploy.sh
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        id: bundle
        with:
          tauriScript: pnpm tauri
          args: --config src-tauri/tauri.prod.conf.json --config src-tauri/tauri.dev.conf.json
      # Release assets are direct downloads and do not consume Actions artifact storage.
      # Every run shares one version, so asset names carry the source commit.
      - name: Upload DEV installers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_PATHS: ${{ steps.bundle.outputs.artifactPaths }}
          INSTALLERS: ${{ matrix.installers }}
        run: |
          set -euo pipefail
          export SHORT_SHA=${GITHUB_SHA::7}
          files=()
          while IFS= read -r file; do
            name=$(basename "$file")
            dest="$RUNNER_TEMP/${name%.*}-$SHORT_SHA.${name##*.}"
            cp "$file" "$dest"
            files+=("$dest")
          done < <(node -e \
            'const re = new RegExp("\\.(" + process.env.INSTALLERS + ")$"); for (const path of JSON.parse(process.env.ARTIFACT_PATHS)) if (re.test(path)) console.log(path)')
          [ -n "${files[0]-}" ] || { echo 'No DEV installers built'; exit 1; }
          # Another platform may create the rolling prerelease first.
          gh release view launcher-dev >/dev/null 2>&1 || gh release create launcher-dev \
            --target "$GITHUB_SHA" --prerelease --latest=false --title 'Launcher DEV' \
            --notes 'Test launcher built from dev. Version matches main; stable auto-updates are disabled. Installer names end with the source commit.' \
            || gh release view launcher-dev >/dev/null
          gh release upload launcher-dev "${files[@]}" --clobber
          # Drop this platform's older installers only once the new ones are downloadable.
          gh release view launcher-dev --json assets --jq '.assets[].name | select(test("\\.(" + env.INSTALLERS + ")$") and (contains("-" + env.SHORT_SHA + ".") | not))' |
            while IFS= read -r old; do gh release delete-asset launcher-dev "$old" --yes; done
