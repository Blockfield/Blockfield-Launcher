name: Release text
description: Facts and generated text for release notes, Discord announcements and PR descriptions. Never fails the caller on a text-generation error.
inputs:
  mode:
    description: release or pr
    required: true
  repository:
    description: Repository whose releases hold the version (release) or the pull request (pr)
    default: ${{ github.repository }}
  version:
    description: Release tag (release mode)
  kind:
    description: client, server, launcher, mod, decor or proxy (release mode)
  out-dir:
    description: Directory for release-notes.md and announcement.json (release mode)
    default: release-text
  source-repository:
    description: Repository with the code and tags when it differs from the release repository
    default: ${{ github.repository }}
  server-repository:
    description: Repository used for the server pin on client and launcher releases
    default: Blockfield/blockfield-dedicated
  repo-root:
    description: Directory holding mods/*.pw.toml and resources.lock.json (client pins in the monorepo live under client/)
    default: '.'
  build-json:
    description: Path to this build's build.json for the client-fingerprint check (client)
    default: ''
  server-changed:
    description: 'true when server/gameplay image digest or map/settings content changed in this release'
    default: 'false'
  fresh:
    description: 'true regenerates the text even when the release already has it (release mode)'
    default: 'false'
  previous:
    description: 'Range start instead of the previous release of the line (consolidated backfill)'
    default: ''
  pins-ref:
    description: "Revision for the new side of the pin diff (the selected release's source commit); empty means HEAD"
    default: ''
  backfill:
    description: 'true marks the notes backfilled and skips reuse (consolidated backfill)'
    default: 'false'
  pr-number:
    description: Pull request number (pr mode)
    default: ${{ github.event.pull_request.number }}
  keep-attribution:
    description: 'true keeps the agent signature line when rewriting a PR body (pr mode)'
    default: 'false'
  github-token:
    description: Token for the release repository (reads/writes Blockfield/blockfield-releases, component releases); the releases PAT lives here
    default: ${{ github.token }}
  source-token:
    description: Token that reads the source repository (PRs, commits, compare, tags of Blockfield/blockfield); the built-in github.token has pull-requests read there while the releases PAT may not
    default: ${{ github.token }}
outputs:
  notes:
    description: Path to release-notes.md
    value: ${{ steps.run.outputs.notes }}
  announcement:
    description: Path to announcement.json, empty when it was not produced
    value: ${{ steps.run.outputs.announcement }}
  player_visible:
    description: 'true or false from structural release facts (client fingerprint or server gameplay/maps/settings changed)'
    value: ${{ steps.run.outputs.player_visible }}
runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        SOURCE_GH_TOKEN: ${{ inputs.source-token }}
        MODE: ${{ inputs.mode }}
        REPOSITORY: ${{ inputs.repository }}
        VERSION: ${{ inputs.version }}
        KIND: ${{ inputs.kind }}
        OUT_DIR: ${{ inputs.out-dir }}
        SOURCE_REPOSITORY: ${{ inputs.source-repository }}
        SERVER_REPOSITORY: ${{ inputs.server-repository }}
        REPO_ROOT: ${{ inputs.repo-root }}
        BUILD_JSON: ${{ inputs.build-json }}
        SERVER_CHANGED: ${{ inputs.server-changed }}
        FRESH: ${{ inputs.fresh }}
        PREVIOUS: ${{ inputs.previous }}
        PINS_REF: ${{ inputs.pins-ref }}
        BACKFILL: ${{ inputs.backfill }}
        PR_NUMBER: ${{ inputs.pr-number }}
        KEEP_ATTRIBUTION: ${{ inputs.keep-attribution }}
      run: |
        if [ "$MODE" = release ]; then
          args=(release --repository "$REPOSITORY" --version "$VERSION" --kind "$KIND" --out-dir "$OUT_DIR" --source-repository "$SOURCE_REPOSITORY" --repo-root "$REPO_ROOT")
          [ -n "$SERVER_REPOSITORY" ] && args+=(--server-repository "$SERVER_REPOSITORY")
          [ -n "$BUILD_JSON" ] && args+=(--build-json "$BUILD_JSON")
          [ "$SERVER_CHANGED" = true ] && args+=(--server-changed)
          [ "$FRESH" = true ] && args+=(--fresh)
          [ -n "$PREVIOUS" ] && args+=(--previous "$PREVIOUS")
          [ -n "$PINS_REF" ] && args+=(--pins-ref "$PINS_REF")
          [ "$BACKFILL" = true ] && args+=(--backfill)
        else
          args=(pr --repository "$REPOSITORY" --pr-number "$PR_NUMBER")
          [ "$KEEP_ATTRIBUTION" = true ] && args+=(--keep-attribution)
        fi
        python3 "$GITHUB_ACTION_PATH/release_text.py" "${args[@]}"
