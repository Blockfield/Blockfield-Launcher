name: Code standards
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.15'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: Cache pinned project tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/quality
            .dev/jdk
          key: quality-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('scripts/toolchain.py', 'scripts/quality.py', 'dev/quality.py') }}
      - run: python -I -X utf8 scripts/toolchain.py --ci
      - run: rustup component add --toolchain 1.99.0 rustfmt clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: standards-ubuntu2404
          workspaces: |
            . -> target
            src-tauri -> src-tauri/target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: scripts/install-tauri-deps.sh libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Locate pnpm store
        id: pnpm-store-1
        shell: bash
        run: echo "path=$(python -I -X utf8 scripts/quality.py run pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store-1.outputs.path }}
          key: pnpm-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: just setup
      - name: Check Rust, frontend and production configuration
        run: just check
  portability:
    name: Native checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    steps:
      - if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Python 3.12 security releases have no Windows/macOS builds in setup-python.
          python-version: '3.14.8'
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.99.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ runner.os == 'Windows' && 'portable-windows' || 'portability-macos' }}
          workspaces: |
            . -> target
            src-tauri -> src-tauri/target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check native Rust code
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test native Rust code
        run: cargo test --workspace --locked
      - name: Check Python script portability
        shell: bash
        run: |
          python -I -X utf8 scripts/test-toolchain.py
          python -I -X utf8 scripts/test-prepare-updater.py
