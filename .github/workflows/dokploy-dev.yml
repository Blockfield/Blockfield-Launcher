name: Dokploy Dev Backend

on:
  push:
    branches: ['dev']
  workflow_dispatch:

concurrency:
  group: dokploy-dev-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/netherg-io/blockfield-launcher-backend

jobs:
  tauri-release:
    name: Build Tauri release
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> src-tauri/target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri release
        run: pnpm tauri:build

      - name: Publish dev release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_notes="Dev build for ${GITHUB_SHA}"
          mapfile -t files < <(find src-tauri/target/release/bundle target/release/bundle -type f 2>/dev/null || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Tauri bundles found."
            exit 1
          fi

          if gh release view dev >/dev/null 2>&1; then
            gh release edit dev --title dev --notes "$release_notes" --prerelease
          else
            gh release create dev --title dev --notes "$release_notes" --prerelease --target "${GITHUB_SHA}" --latest=false
          fi

          release_id="$(gh release view dev --json databaseId --jq .databaseId)"
          gh api -X PATCH "repos/{owner}/{repo}/releases/${release_id}" \
            -f tag_name=dev \
            -f name=dev \
            -f body="$release_notes" \
            -F prerelease=true \
            -F make_latest=false \
            --silent

          gh release upload dev "${files[@]}" --clobber

  build-push-deploy:
    name: Build, push, deploy
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev
            type=sha,format=short,prefix=dev-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./server/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Dokploy deployment
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK_URL" ]; then
            echo "DOKPLOY_WEBHOOK_URL secret is not configured; image was pushed only."
            exit 0
          fi

          curl --fail --show-error --silent "$DOKPLOY_WEBHOOK_URL"
