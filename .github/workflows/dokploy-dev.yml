name: Dokploy Dev

on:
  push:
    branches: ['dev']
  workflow_dispatch:

concurrency:
  group: dokploy-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  BACKEND_IMAGE_NAME: ghcr.io/netherg-io/blockfield-launcher-backend
  FILAMENT_IMAGE_NAME: ghcr.io/netherg-io/blockfield-launcher-filament

jobs:
  tauri-release:
    name: Build Windows Tauri release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> src-tauri/target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri release
        run: pnpm tauri:build

      - name: Publish dev release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $releaseNotes = "Dev Windows build for $env:GITHUB_SHA"
          $files = @(
            Get-ChildItem -Path target/release/bundle, src-tauri/target/release/bundle -Recurse -File -Filter *.exe -ErrorAction SilentlyContinue |
              Sort-Object FullName |
              Select-Object -ExpandProperty FullName
          )
          if ($files.Count -eq 0) {
            Write-Error "No Windows Tauri .exe bundles found."
            exit 1
          }

          gh release view develop *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit develop --title develop --notes $releaseNotes --prerelease
          } else {
            gh release create develop --title develop --notes $releaseNotes --prerelease --target $env:GITHUB_SHA --latest=false
          }

          $releaseId = gh release view develop --json databaseId --jq .databaseId
          gh api -X PATCH "repos/{owner}/{repo}/releases/$releaseId" `
            -f tag_name=develop `
            -f name=develop `
            -f body="$releaseNotes" `
            -F prerelease=true `
            -F make_latest=false `
            --silent

          gh release view develop --json assets --jq '.assets[].name' | ForEach-Object {
            gh release delete-asset develop $_ -y
          }

          gh release upload develop @files --clobber

  build-push-deploy:
    name: Build, push images, deploy
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend Docker metadata
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE_NAME }}
          tags: |
            type=raw,value=develop
            type=sha,format=short,prefix=develop-

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./server/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Filament Docker metadata
        id: filament-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FILAMENT_IMAGE_NAME }}
          tags: |
            type=raw,value=develop
            type=sha,format=short,prefix=develop-

      - name: Build and push Filament image
        uses: docker/build-push-action@v6
        with:
          context: ./server/admin
          file: ./server/admin/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.filament-meta.outputs.tags }}
          labels: ${{ steps.filament-meta.outputs.labels }}
          cache-from: type=gha,scope=filament
          cache-to: type=gha,mode=max,scope=filament

      - name: Trigger Dokploy backend deploy
        env:
          DOKPLOY_BACKEND_WEBHOOK_URL: ${{ secrets.DOKPLOY_BACKEND_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_BACKEND_WEBHOOK_URL" ]; then
            echo "DOKPLOY_BACKEND_WEBHOOK_URL secret is not configured; skipping backend deploy."
          else
            curl --fail --show-error --silent "$DOKPLOY_BACKEND_WEBHOOK_URL"
          fi

      - name: Trigger Dokploy Filament deploy
        env:
          DOKPLOY_FILAMENT_WEBHOOK_URL: ${{ secrets.DOKPLOY_FILAMENT_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_FILAMENT_WEBHOOK_URL" ]; then
            echo "DOKPLOY_FILAMENT_WEBHOOK_URL secret is not configured; skipping Filament deploy."
          else
            curl --fail --show-error --silent "$DOKPLOY_FILAMENT_WEBHOOK_URL"
          fi
