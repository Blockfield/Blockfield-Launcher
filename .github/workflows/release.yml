name: Launcher Release

on:
  push:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: launcher-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - uses: taiki-e/install-action@v2.83.2
        with:
          tool: cargo-audit
          fallback: none
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm version:check
      - run: pnpm build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: pnpm audit --audit-level high
      - run: cargo audit

  secret-scan:
    name: Secret scan
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan Git history
        run: >-
          docker run --rm
          --volume "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          detect --source=/repo --config=/repo/.gitleaks.toml --verbose --redact

  tauri-release:
    name: Build launcher (${{ matrix.name }})
    needs: [quality, secret-scan]
    environment: dev
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            args: ''
          - name: windows-x86_64
            os: windows-latest
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> src-tauri/target
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm config:check
        env:
          VITE_BLOCKFIELD_PACK_URL: ${{ vars.VITE_BLOCKFIELD_PACK_URL }}
      - name: Patch linuxdeploy GTK plugin for Wayland compatibility and metadata
        if: runner.os == 'Linux'
        run: |
          mkdir -p ~/.cache/tauri
          curl -sSL -o ~/.cache/tauri/linuxdeploy-plugin-gtk.sh https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          APP_VER=$(node -p "require('./package.json').version")
          cat << EOF >> ~/.cache/tauri/linuxdeploy-plugin-gtk.sh

          # Custom patch: exclude bundled Wayland client libraries so host Mesa/Wayland graphics stack is used instead.
          # This prevents "Could not create default EGL display: EGL_BAD_PARAMETER" white screen crash on modern Wayland environments.
          rm -f "\$APPDIR"/usr/lib/libwayland*.so* "\$APPDIR"/usr/lib/*/libwayland*.so* || true

          # Custom patch: inject X-AppImage-Version into .desktop files so Gear Lever and AppImage integrators display version
          for d in "\$APPDIR"/*.desktop "\$APPDIR"/usr/share/applications/*.desktop; do
            if [ -f "\$d" ] && ! grep -q "X-AppImage-Version" "\$d"; then
              echo "X-AppImage-Version=$APP_VER" >> "\$d"
            fi
          done

          # Custom patch: undo the plugin's GDK_BACKEND=x11 in the hook that ships inside the AppImage.
          # x11 was a workaround for the Wayland backend crashing on the bundled libwayland, which we
          # no longer ship (see patch above). Under XWayland mutter scales the window twice (1280x720
          # arrives as 2560x1514) and claims a 74px decoration frame the window never asked for, so
          # clicks land next to the UI instead of on it.
          # Fail the build rather than ship a silent no-op if the plugin moves its hook.
          gtk_hook="\$APPDIR/apprun-hooks/linuxdeploy-plugin-gtk.sh"
          [ -f "\$gtk_hook" ] || { echo "GTK AppRun hook missing at \$gtk_hook" >&2; exit 1; }
          echo 'unset GDK_BACKEND' >> "\$gtk_hook"
          EOF
          chmod +x ~/.cache/tauri/linuxdeploy-plugin-gtk.sh
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          VITE_BLOCKFIELD_PACK_URL: ${{ vars.VITE_BLOCKFIELD_PACK_URL }}
          VITE_BRAND: ${{ vars.VITE_BRAND || 'BLOCKFIELD' }}
          VITE_BRAND_SUBTITLE: ${{ vars.VITE_BRAND_SUBTITLE || 'TACTICAL OPS' }}
          VITE_CHROME_TITLE: ${{ vars.VITE_CHROME_TITLE || 'BLOCKFIELD LAUNCHER' }}
          VITE_OPERATION_NAME: ${{ vars.VITE_OPERATION_NAME || 'IRON FRONT' }}
          VITE_SEASON: ${{ vars.VITE_SEASON || '/ SEASON 01' }}
          VITE_SERVER_NAME: ${{ vars.VITE_SERVER_NAME || 'BLOCKFIELD - PRIMARY' }}
          VITE_SERVER_IP: ${{ vars.VITE_SERVER_IP || 'minecraft.play.nether.pp.ua:25565' }}
          VITE_COPYRIGHT: ${{ vars.VITE_COPYRIGHT || '2026 BLOCKFIELD COMMAND' }}
          BLOCKFIELD_MOJANG_MANIFEST_URL: ${{ vars.BLOCKFIELD_MOJANG_MANIFEST_URL || 'https://piston-meta.mojang.com/mc/game/version_manifest_v2.json' }}
          BLOCKFIELD_MOJANG_ASSET_BASE_URL: ${{ vars.BLOCKFIELD_MOJANG_ASSET_BASE_URL || 'https://resources.download.minecraft.net' }}
          BLOCKFIELD_FABRIC_META_URL: ${{ vars.BLOCKFIELD_FABRIC_META_URL || 'https://meta.fabricmc.net' }}
          BLOCKFIELD_LAUNCHER_NAME: ${{ vars.BLOCKFIELD_LAUNCHER_NAME || 'BlockfieldLauncher' }}
          BLOCKFIELD_MINECRAFT_VERSION: ${{ vars.BLOCKFIELD_MINECRAFT_VERSION || '1.21.1' }}
          BLOCKFIELD_DEFAULT_RAM_MB: ${{ vars.BLOCKFIELD_DEFAULT_RAM_MB || '4096' }}
          BLOCKFIELD_AUTO_UPDATE: ${{ vars.BLOCKFIELD_AUTO_UPDATE || 'true' }}
          BLOCKFIELD_DEFAULT_LANG: ${{ vars.BLOCKFIELD_DEFAULT_LANG || 'en' }}
        with:
          tauriScript: pnpm tauri
          args: --config src-tauri/tauri.prod.conf.json ${{ matrix.args }}
          tagName: launcher-v__VERSION__
          releaseName: Launcher v__VERSION__
          releaseBody: Stable release built from main (${{ github.sha }})
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

  publish-launcher:
    # The source repo is private, so its release assets are unusable by the Tauri updater.
    # Mirror bundles + latest.json into the public releases repo (https://github.com/netherg-io/blockfield-launcher-releases).
    name: Publish launcher release
    needs: [tauri-release]
    runs-on: ubuntu-22.04
    environment: dev
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download build assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mkdir -p release
          gh release download "launcher-v$version" --dir release
          python3 - "$version" <<'EOF'
          import json, sys
          version = sys.argv[1]
          base = "https://github.com/netherg-io/blockfield-launcher-releases/releases/download/launcher-v" + version + "/"
          path = "release/latest.json"
          data = json.load(open(path))
          for platform in data["platforms"].values():
              platform["url"] = base + platform["url"].rsplit("/", 1)[-1]
          json.dump(data, open(path, "w"), indent=2)
          print(json.dumps(data["platforms"], indent=1))
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          repository: netherg-io/blockfield-launcher-releases
          token: ${{ secrets.RELEASES_TOKEN }} # PAT with contents:write on the releases repo
          tag_name: launcher-v${{ env.VERSION }}
          name: Launcher v${{ env.VERSION }}
          body: |
            Основная версия Blockfield Launcher ${{ env.VERSION }}.

            - Linux: окно снова принимает клики — AppImage больше не форсирует X11-бэкенд, из-за которого на Wayland окно масштабировалось дважды.
            - Исправлены команды перед запуском и после выхода: окружение AppImage больше не ломает python3 и другие программы системы.
            - Кнопка поддержки снова открывает ссылку в браузере.

          draft: false
          prerelease: false
          make_latest: true
          files: release/*
